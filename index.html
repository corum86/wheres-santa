<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Where's Santa?</title>
<meta name="description" content="A Christmas pixel-art adventure in 8 stages: find Santa before Christmas morning! Plays in the browser, on desktop and mobile. English, Deutsch, Ελληνικά.">
<meta property="og:title" content="Where's Santa?">
<meta property="og:description" content="A Christmas pixel-art adventure in 8 stages: find Santa before Christmas morning! Plays in the browser, on desktop and mobile. English, Deutsch, Ελληνικά.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0d1030">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cpath fill='%23e0333f' d='M6 1h3v1h2v1h1v2H4V3h1V2h1z'/%3E%3Cpath fill='%23fff' d='M12 3h2v2h-2zM3 5h10v2H3z'/%3E%3Cpath fill='%23f5c9a0' d='M4 7h8v3H4z'/%3E%3Cpath fill='%230d1030' d='M6 8h1v1H6zM9 8h1v1H9z'/%3E%3Cpath fill='%23fff' d='M3 10h10v2h-1v2h-2v1H6v-1H4v-2H3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0d1030}
#fit{position:fixed;left:0;top:0;width:960px;height:540px;transform-origin:0 0}
#host{position:relative;width:960px;height:540px}
noscript p{color:#fff;font:18px sans-serif;text-align:center;margin-top:40vh}

body{margin:0;background:#0d1030}
a{color:#ffd84a}a:hover{color:#ffe9a8}
.xm-root:focus{outline:none}
.xm-btn{cursor:pointer;transition:transform .08s ease, filter .08s ease}
.xm-btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.xm-btn:active{transform:translateY(1px)}
.xm-btn:disabled{filter:none;transform:none;cursor:default}
.xm-btn:focus-visible{outline:4px solid #ffd84a;outline-offset:3px}
.xm-blink{animation:xmBlink 1s steps(1) infinite}
.xm-banner{animation:xmBanner 2.8s ease-out forwards}
.xm-bob{animation:xmBob 2.4s ease-in-out infinite}
.xm-pop{animation:xmPop .35s ease-out}
.xm-glow{animation:xmPop .35s ease-out, xmGlow 1.6s ease-in-out .35s infinite}
.xm-touch{touch-action:none;user-select:none;-webkit-user-select:none}
.xm-help span{white-space:nowrap}
@keyframes xmBlink{50%{opacity:0}}
@keyframes xmBanner{0%{transform:scale(.4);opacity:0}10%{transform:scale(1.12);opacity:1}18%{transform:scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
@keyframes xmBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes xmGlow{0%,100%{box-shadow:0 0 0 3px #0d1030}50%{box-shadow:0 0 0 3px #0d1030,0 0 16px 5px rgba(255,216,74,.75)}}
@keyframes xmPop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.xm-bob,.xm-blink,.xm-banner,.xm-pop,.xm-glow{animation:none}}

</style>
<script src="assets/three.js"></script>
</head>
<body>
<noscript><p>Where's Santa? needs JavaScript to run.</p></noscript>
<div id="fit"><div id="host"></div></div>
<template id="tpl">
<div class="xm-root" data-xmas-root="1" ref="{{ rootRef }}" tabIndex="0" lang="{{ t.code }}" aria-label="{{ t.rootLabel }}" style="position: relative; width: 960px; height: 540px; overflow: hidden; background: {{ rootBg }}; font-family: 'Ubuntu', 'Trebuchet MS', 'Segoe UI', sans-serif; font-weight: 500; -webkit-font-smoothing: antialiased; color: #ffffff; user-select: none">
<div class="xm-stage" style="position: absolute; left: {{ fsX }}px; top: {{ fsY }}px; width: 960px; height: 540px; overflow: hidden; transform-origin: 0 0; transform: scale({{ fsK }})">
<canvas data-xmas="1" ref="{{ canvasRef }}" width="960" height="540" role="img" aria-label="{{ t.screenLabel }}" style="position: absolute; left: 0; top: 0; width: 960px; height: 540px; display: block; image-rendering: pixelated"></canvas>

<sc-if value="{{ hud }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 18px; top: 46px; display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; background: rgba(13,16,48,0.72); border: 3px solid #f4f7ff; box-shadow: 0 0 0 3px #0d1030">
<div style="display: flex; gap: 6px; align-items: center">
<sc-for list="{{ hearts }}" as="h" hint-placeholder-count="5">
<svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{ h.fill }}" d="M1 0h2v1H1z M4 0h2v1H4z M0 1h7v2H0z M1 3h5v1H1z M2 4h3v1H2z M3 5h1v1H3z"></path><path fill="#ff4d5e" d="{{ h.halfD }}"></path><rect x="1" y="1" width="1" height="1" fill="{{ h.hi }}"></rect></svg>
</sc-for>
</div>
<div style="display: flex; gap: 10px; align-items: center; font-family: 'Press Start 2P', monospace; font-size: 15px; color: #ffd84a">
<svg width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#e3a85a" d="M2 0h4v1H2z M1 1h6v1H1z M0 2h8v4H0z M1 6h6v1H1z M2 7h4v1H2z"></path><path fill="#5a2e1a" d="M2 2h1v1H2z M5 3h1v1H5z M3 5h1v1H3z M6 5h1v1H6z"></path></svg>
<span aria-label="{{ t.cookiesLabel }}">{{ cookies }}/{{ cookiesTotal }}</span>
</div>
<div style="display: flex; gap: 10px; align-items: center; font-family: 'Press Start 2P', monospace; font-size: 15px; color: #7dff8a">
<svg width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#2f9a52" d="M3 0h3v1H3z M2 1h5v4H2z M0 2h2v2H0z M1 4h1v1H1z"></path><path fill="#ffffff" d="M2 5h5v3H2z"></path><path fill="#82d65f" d="M3 1h1v2H3z"></path></svg>
<span aria-label="{{ t.mittensLabel }}">{{ mittens }}/8</span>
</div>
<sc-if value="{{ zOn }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 10px; align-items: center; font-family: 'Press Start 2P', monospace; font-size: 15px; color: #cfdcec">
<svg width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#cfdcec" d="M0 1h3v3H0z M3 2h5v1H3z M6 3h1v2H6z M4 3h1v1H4z"></path><path fill="#3b3846" d="M1 2h1v1H1z"></path></svg>
<span aria-label="{{ t.keysLabel }}">{{ zKeys }}</span>
<svg width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true" style="display: {{ zBigDisp }}"><path fill="#ffd84a" d="M0 1h3v3H0z M3 2h5v1H3z M6 3h1v2H6z M4 3h1v1H4z"></path><path fill="#8a5a1a" d="M1 2h1v1H1z"></path></svg>
</div>
</sc-if>
</div>
<div style="position: absolute; right: 18px; top: 46px; display: flex; gap: 10px; align-items: center">
<sc-if value="{{ fsOn }}" hint-placeholder-val="{{ true }}">
<button class="xm-btn" type="button" aria-label="{{ fsLabel }}" title="{{ fsLabel }}" onClick="{{ onFs }}" style="width: 48px; height: 48px; padding: 0; display: flex; align-items: center; justify-content: center; background: #0d1030; border: 3px solid #f4f7ff; box-shadow: 0 0 0 3px #0d1030; color: #f4f7ff">
<sc-if value="{{ fsOut }}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 0h4v1H1v3H0z M7 0h4v4h-1V1H7z M0 7h1v3h3v1H0z M10 7h1v4H7v-1h3z"></path></svg></sc-if>
<sc-if value="{{ fsIn }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 0h1v4H0V3h3z M7 0h1v3h3v1H7z M0 7h4v4H3V8H0z M7 7h4v1H8v3H7z"></path></svg></sc-if>
</button>
</sc-if>
<button class="xm-btn" type="button" aria-label="{{ muteLabel }}" onClick="{{ onMute }}" style="width: 48px; height: 48px; padding: 0; display: flex; align-items: center; justify-content: center; background: #0d1030; border: 3px solid #f4f7ff; box-shadow: 0 0 0 3px #0d1030; color: #f4f7ff">
<sc-if value="{{ notMuted }}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4.5h2l3-2.5v8L4 7.5H2z" fill="currentColor"></path><path d="M8.5 4a2.5 2.5 0 0 1 0 4M9.8 2.6a4.4 4.4 0 0 1 0 6.8"></path></svg></sc-if>
<sc-if value="{{ muted }}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4.5h2l3-2.5v8L4 7.5H2z" fill="currentColor"></path><path d="M8.5 4.5l3 3M11.5 4.5l-3 3"></path></svg></sc-if>
</button>
<button class="xm-btn" type="button" aria-label="{{ t.pause }}" onClick="{{ onPause }}" style="width: 48px; height: 48px; padding: 0; display: flex; align-items: center; justify-content: center; background: #0d1030; border: 3px solid #f4f7ff; box-shadow: 0 0 0 3px #0d1030; color: #f4f7ff">
<svg width="20" height="20" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1" width="2.5" height="8" fill="currentColor"></rect><rect x="6" y="1" width="2.5" height="8" fill="currentColor"></rect></svg>
</button>
</div>
</sc-if>

<sc-if value="{{ bossOn }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 50%; top: 56px; transform: translateX(-50%); width: 420px; display: flex; flex-direction: column; gap: 6px; align-items: center">
<div style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #8fdcff; text-shadow: 3px 3px 0 #0d1030; letter-spacing: 2px">{{ bossName }}</div>
<div role="progressbar" aria-label="{{ t.bossHealth }}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ bossPct }}" style="width: 100%; height: 18px; background: #0d1030; border: 3px solid #f4f7ff; box-shadow: 0 0 0 3px #0d1030; box-sizing: border-box; padding: 2px">
<div style="height: 100%; width: {{ bossPct }}%; background: #4aa3d8; box-shadow: inset 0 -4px 0 #2a6a9a, inset 0 3px 0 #bfe9ff; transition: width .2s steps(4)"></div>
</div>
</div>
</sc-if>

<sc-if value="{{ bannerOn }}" hint-placeholder-val="{{ false }}">
<div class="xm-banner" style="position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: none">
<div style="font-family: 'Press Start 2P', monospace; font-size: 46px; color: #ffd84a; text-shadow: 4px 4px 0 #8e1c2a, 8px 8px 0 #0d1030; letter-spacing: 3px">{{ banner }}</div>
<div style="font-family: 'Press Start 2P', monospace; font-size: 18px; color: #ffffff; text-shadow: 3px 3px 0 #0d1030; background: rgba(13,16,48,0.6); padding: 8px 14px">{{ bannerSub }}</div>
</div>
</sc-if>

<sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}">
<div class="xm-pop" role="status" style="position: absolute; left: 50%; top: 48px; transform: translateX(-50%); width: max-content; max-width: 440px; box-sizing: border-box; padding: 8px 16px; background: #0d1030; border: 3px solid #ffd84a; box-shadow: 0 0 0 3px #0d1030; font-size: 19px; line-height: 1.25; text-align: center; color: #ffffff; pointer-events: none">{{ toast }}</div>
</sc-if>

<sc-if value="{{ dlgOn }}" hint-placeholder-val="{{ false }}">
<button class="xm-btn" type="button" aria-label="{{ t.cont }}" onClick="{{ onAdvance }}" style="position: absolute; left: 48px; right: 48px; bottom: 26px; min-height: 124px; padding: 22px 28px 18px; box-sizing: border-box; text-align: left; background: #0d1030; border: 4px solid #f4f7ff; box-shadow: 0 0 0 4px #0d1030, 0 8px 0 4px rgba(0,0,0,0.35); font-family: 'Ubuntu', 'Trebuchet MS', 'Segoe UI', sans-serif; transform: none">
<sc-if value="{{ hasName }}" hint-placeholder-val="{{ true }}">
<span style="position: absolute; left: 22px; top: -20px; padding: 6px 12px; background: #0d1030; border: 3px solid {{ dlgColor }}; font-family: 'Press Start 2P', monospace; font-size: 14px; color: {{ dlgColor }}">{{ dlgName }}</span>
</sc-if>
<span style="display: block; font-size: 25px; font-weight: 500; line-height: 1.35; letter-spacing: 0.2px; color: {{ dlgTextColor }}; font-style: {{ dlgStyle }}; min-height: 68px">{{ dlgText }}</span>
<sc-if value="{{ dlgDone }}" hint-placeholder-val="{{ false }}">
<svg class="xm-blink" width="18" height="12" viewBox="0 0 6 4" shape-rendering="crispEdges" aria-hidden="true" style="position: absolute; right: 22px; bottom: 14px"><path fill="#ffd84a" d="M0 0h6v1H0z M1 1h4v1H1z M2 2h2v1H2z"></path></svg>
</sc-if>
</button>
</sc-if>

<sc-if value="{{ skipOn }}" hint-placeholder-val="{{ false }}">
<button class="xm-btn" type="button" onClick="{{ onSkip }}" style="position: absolute; right: 18px; top: 46px; height: 44px; padding: 0 14px; display: flex; gap: 10px; align-items: center; background: #0d1030; border: 3px solid #f4f7ff; box-shadow: 0 0 0 3px #0d1030; color: #f4f7ff; font-family: 'Press Start 2P', monospace; font-size: 12px">{{ t.skip }}<svg width="18" height="14" viewBox="0 0 9 7" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 0h1v7H0z M1 1h1v5H1z M2 2h1v3H2z M3 3h1v1H3z M4 0h1v7H4z M5 1h1v5H5z M6 2h1v3H6z M7 3h1v1H7z"></path></svg></button>
</sc-if>

<sc-if value="{{ touchOn }}" hint-placeholder-val="{{ false }}">
<sc-if value="{{ stickShow }}" hint-placeholder-val="{{ true }}">
<div class="xm-touch" data-xmas-stick="1" role="group" aria-label="{{ t.stickLabel }}" aria-hidden="{{ stHid }}" onPointerDown="{{ stDown }}" style="position: absolute; left: 0; top: 90px; width: 470px; height: 450px; z-index: 3; opacity: {{ stOp }}; pointer-events: {{ stPE }}; transition: opacity 0.15s">
<div style="position: absolute; left: {{ stBx }}px; top: {{ stBy }}px; width: 132px; height: 132px; margin: -66px 0 0 -66px; box-sizing: border-box; border-radius: 50%; border: 3px solid rgba(244,247,255,{{ stA }}); background: rgba(13,16,48,{{ stBgA }}); pointer-events: none">
<svg width="126" height="126" viewBox="0 0 42 42" shape-rendering="crispEdges" aria-hidden="true" style="position: absolute; left: 0; top: 0"><path fill="{{ stU }}" d="M19 4h4v1h1v1h1v1h-8V6h1V5h1z"></path><path fill="{{ stD }}" d="M17 35h8v1h-1v1h-1v1h-4v-1h-1v-1h-1z"></path><path fill="{{ stL }}" d="M4 19h1v-1h1v-1h1v8H6v-1H5v-1H4z"></path><path fill="{{ stR }}" d="M35 17h1v1h1v1h1v4h-1v1h-1v1h-1z"></path></svg>
</div>
<div style="position: absolute; left: {{ stKx }}px; top: {{ stKy }}px; width: 56px; height: 56px; margin: -28px 0 0 -28px; box-sizing: border-box; border-radius: 50%; border: 3px solid rgba(255,255,255,{{ stA }}); background: rgba(255,216,74,{{ stKA }}); box-shadow: 0 3px 0 rgba(13,16,48,0.6); pointer-events: none"></div>
</div>
</sc-if>
<div style="position: absolute; right: 22px; bottom: 22px; display: flex; gap: 14px; align-items: flex-end">
<button class="xm-touch" type="button" aria-label="{{ t.starL }}" onPointerDown="{{ tPodDown }}" onPointerUp="{{ tPodUp }}" onPointerLeave="{{ tPodUp }}" onPointerCancel="{{ tPodUp }}" style="opacity: {{ opPod }}; transition: opacity 0.12s; display: {{ starDisp }}; width: 76px; height: 76px; margin-bottom: 64px; border-radius: 50%; background: rgba(201,149,42,0.8); border: 3px solid #f4f7ff; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true"><path fill="#ffe066" d="M4 0h1v2H4z M3 2h3v1H3z M0 3h9v1H0z M1 4h7v1H1z M2 5h5v1H2z M1 6h3v1H1z M5 6h3v1H5z M1 7h2v1H1z M6 7h2v1H6z"></path></svg></button>
<button class="xm-touch" type="button" aria-label="{{ atkLabel }}" onPointerDown="{{ tAtkDown }}" onPointerUp="{{ tAtkUp }}" onPointerLeave="{{ tAtkUp }}" onPointerCancel="{{ tAtkUp }}" style="opacity: {{ opAtk }}; transition: opacity 0.12s; width: 84px; height: 84px; border-radius: 50%; background: rgba(224,51,63,0.7); border: 3px solid #f4f7ff; color: #ffffff; font-family: 'Press Start 2P', monospace; font-size: 18px">X</button>
<button class="xm-touch" type="button" aria-label="{{ jumpLabel }}" onPointerDown="{{ tJumpDown }}" onPointerUp="{{ tJumpUp }}" onPointerLeave="{{ tJumpUp }}" onPointerCancel="{{ tJumpUp }}" style="opacity: {{ opJump }}; transition: opacity 0.12s; display: {{ jumpDisp }}; width: 96px; height: 96px; margin-bottom: 30px; border-radius: 50%; background: rgba(47,154,82,0.75); border: 3px solid #f4f7ff; color: #ffffff; font-family: 'Press Start 2P', monospace; font-size: 13px">{{ t.jumpShort }}</button>
</div>
</sc-if>

<sc-if value="{{ isTitle }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 98px; box-sizing: border-box; background: linear-gradient(180deg, rgba(11,14,46,0.82) 0%, rgba(11,14,46,0.25) 46%, rgba(11,14,46,0) 62%, rgba(11,14,46,0.7) 100%)">
<div role="group" aria-label="{{ t.language }}" style="position: absolute; right: 18px; top: 46px; display: flex; gap: 8px">
<sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
<button class="xm-btn" type="button" lang="{{ l.code }}" aria-label="{{ l.name }}" aria-pressed="{{ l.pressed }}" onClick="{{ l.pick }}" style="min-width: 56px; height: 44px; padding: 0 10px; background: {{ l.bg }}; border: 3px solid #f4f7ff; box-shadow: 0 0 0 3px #0d1030; color: {{ l.fg }}; font-family: 'Press Start 2P', monospace; font-size: 13px">{{ l.label }}</button>
</sc-for>
<sc-if value="{{ fsOn }}" hint-placeholder-val="{{ true }}">
<button class="xm-btn" type="button" aria-label="{{ fsLabel }}" title="{{ fsLabel }}" onClick="{{ onFs }}" style="width: 44px; height: 44px; margin-left: 6px; padding: 0; display: flex; align-items: center; justify-content: center; background: #0d1030; border: 3px solid #f4f7ff; box-shadow: 0 0 0 3px #0d1030; color: #f4f7ff">
<sc-if value="{{ fsOut }}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 0h4v1H1v3H0z M7 0h4v4h-1V1H7z M0 7h1v3h3v1H0z M10 7h1v4H7v-1h3z"></path></svg></sc-if>
<sc-if value="{{ fsIn }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 0h1v4H0V3h3z M7 0h1v3h3v1H7z M0 7h4v4H3V8H0z M7 7h4v1H8v3H7z"></path></svg></sc-if>
</button>
</sc-if>
</div>
<div role="group" aria-label="{{ t.diffLabel }}" style="position: absolute; left: 18px; top: 46px; display: flex; gap: 8px; align-items: center; font-family: 'Press Start 2P', monospace; font-size: 12px; color: #ffd84a; text-shadow: 2px 2px 0 #0d1030">
<span>{{ t.diffLabel }}</span>
<sc-for list="{{ diffBtns }}" as="d" hint-placeholder-count="3">
<button class="xm-btn" type="button" title="{{ d.tip }}" aria-label="{{ d.tip }}" aria-pressed="{{ d.pressed }}" onClick="{{ d.pick }}" style="height: 44px; padding: 0 10px; background: {{ d.bg }}; border: 3px solid #f4f7ff; box-shadow: 0 0 0 3px #0d1030; color: {{ d.fg }}; font-family: 'Press Start 2P', monospace; font-size: 12px; text-shadow: none">{{ d.label }}</button>
</sc-for>
</div>
<div style="font-family: 'Press Start 2P', monospace; font-size: 16px; color: #ffd84a; letter-spacing: 3px; text-shadow: 3px 3px 0 #0d1030">{{ t.kicker }}</div>
<h1 class="xm-bob" style="margin: 20px 0 0; font-family: 'Press Start 2P', monospace; font-weight: 400; font-size: {{ t.titleSize }}px; line-height: 1.2; color: #ff4d5e; text-align: center; text-shadow: 0 5px 0 #ffffff, 0 10px 0 #8e1c2a, 6px 16px 0 #0d1030; letter-spacing: 2px">{{ t.title1 }}<br>{{ t.title2 }}</h1>
<p style="margin: 30px 0 0; padding: 0 40px; font-size: 24px; color: #ffffff; text-align: center; text-shadow: 2px 2px 0 #0d1030">{{ t.starring }}</p>
<div style="display: flex; gap: 16px; margin-top: 24px">
<button class="xm-btn" type="button" onClick="{{ onStart }}" style="height: 60px; padding: 0 30px; background: #e0333f; border: 4px solid #ffffff; box-shadow: 0 0 0 4px #0d1030, 0 7px 0 4px #8e1c2a; color: #ffffff; font-family: 'Press Start 2P', monospace; font-size: 18px">{{ t.start }}</button>
<button class="xm-btn" type="button" onClick="{{ onSkipStory }}" style="height: 60px; padding: 0 22px; background: #0d1030; border: 4px solid #ffffff; box-shadow: 0 0 0 4px #0d1030; color: #ffffff; font-family: 'Press Start 2P', monospace; font-size: 13px">{{ t.skipStory }}</button>

    boss4: { en: 'I am SLUSHMAN! Nobody gets past me. Not even with... is that a candy cane?', de: 'Ich bin MATSCHMANN! An mir kommt keiner vorbei. Nicht mal mit... ist das eine Zuckerstange?', el: 'Είμαι ο ΛΑΣΠΟΧΙΟΝΑΣ! Κανείς δεν περνάει από μένα. Ούτε καν με... αυτό είναι ζαχαρωτό μπαστουνάκι;' },
    boss5: { en: "It's a GIANT candy cane. Out of my way, snow-for-brains!", de: 'Eine RIESEN-Zuckerstange. Aus dem Weg, Schneehirn!', el: 'Είναι ΓΙΓΑΝΤΙΟ ζαχαρωτό μπαστουνάκι. Φύγε από τη μέση, χιονοκεφάλα!' },
    boss6: { en: "Grr! Just don't bonk my snowballs back at me! ...WAIT. Forget I said that.", de: 'Grr! Schlag bloß nicht meine Schneebälle zurück! ...MOMENT. Vergiss, was ich gesagt hab.', el: 'Γρρ! Μόνο μη χτυπήσεις τις χιονόμπαλές μου πίσω σε μένα! ...ΣΤΑΣΟΥ. Ξέχνα ό,τι είπα.' },
    bossAgain: { en: 'Back for more, sock-wearer? Hohoho... I mean, HAHAHA!', de: 'Schon wieder da, Sockenträger? Hohoho... äh, ich meine: HAHAHA!', el: 'Πάλι εδώ, μικρέ με τις κάλτσες; Χο χο χο... εννοώ, ΧΑ ΧΑ ΧΑ!' },
    melt1: { en: "Nooo! I'm... MELTING! Into a... a SLUSHY!", de: 'Neiiin! Ich... SCHMELZE! Ich werde zu... zu SCHNEEMATSCH!', el: 'Όχιιι! Λιώνω... ΛΙΩΝΩ! Γίνομαι... ΓΡΑΝΙΤΑ!' },
    melt2: { en: '(gurgle) ...The Boss will never... let Santa... go... (blub)', de: '(blubber) ...Der Boss wird den Weihnachtsmann... niemals... gehen lassen... (blubb)', el: '(γουργουρητό) ...Το Αφεντικό δεν θα αφήσει ποτέ... τον Αϊ-Βασίλη... να φύγει... (μπλουμπ)' },
    melt3: { en: 'Something sparkly is lying in the slush...', de: 'Im Matsch funkelt etwas...', el: 'Κάτι γυαλίζει μέσα στο λασπόχιονο...' },
    mitten1: { en: "Santa's mitten! He really WAS here!", de: 'Der Fäustling vom Weihnachtsmann! Er WAR wirklich hier!', el: 'Το γάντι του Αϊ-Βασίλη! ΗΤΑΝ πράγματι εδώ!' },
    mitten2: { en: "\"The Boss\"...? The trail leads out to the street. Hold on, Santa... I'm coming!", de: '„Der Boss“...? Die Spur führt hinaus auf die Straße. Halte durch, Weihnachtsmann... ich komme!', el: '«Το Αφεντικό»...; Τα ίχνη βγαίνουν στον δρόμο. Κράτα γερά, Αϊ-Βασίλη... έρχομαι!' },
    // --- toasts & banners (HTML text)
    tipJump: { en: 'Tip: hold Jump to jump higher!', de: 'Tipp: Sprungtaste halten = höher springen!', el: 'Συμβουλή: κράτα πατημένο το άλμα για πιο ψηλά!' },
    tipDrop: { en: 'Tip: Down + Jump drops through furniture', de: 'Tipp: Runter + Springen lässt dich durch Möbel fallen', el: 'Συμβουλή: Κάτω + Άλμα για να πέσεις από τα έπιπλα' },
    tipBricks: { en: 'Ouch-bricks ahead. Jump over them!', de: 'Autsch-Bausteine voraus. Spring drüber!', el: 'Τουβλάκια-αουτς μπροστά. Πήδα από πάνω τους!' },
    tipControls: { en: 'Arrows move · Space jumps · X swings the candy cane', de: 'Pfeile: laufen · Leertaste: springen · X: Zuckerstange schwingen', el: 'Βέλη: κίνηση · Space: άλμα · X: χτύπημα με το μπαστουνάκι' },
    tipGate: { en: 'The gate is open! Head right →', de: 'Das Tor ist offen! Weiter nach rechts →', el: 'Η αυλόπορτα άνοιξε! Πήγαινε δεξιά →' },
    stage: { en: 'STAGE 1', de: 'LEVEL 1', el: 'ΠΙΣΤΑ 1' },
    stageSub: { en: 'Home Sweet Hazard', de: 'Trautes Heim, Gefahr allein', el: 'Σπίτι μου, κινδυνάκι μου' },
    kitchen: { en: 'THE KITCHEN', de: 'DIE KÜCHE', el: 'Η ΚΟΥΖΙΝΑ' },
    kitchenSub: { en: 'Beware: cat on a robot vacuum', de: 'Achtung: Katze auf Saugroboter', el: 'Προσοχή: γάτα πάνω σε ρομπότ-σκούπα' },
    yard: { en: 'THE BACKYARD', de: 'DER GARTEN', el: 'Η ΑΥΛΗ' },
    yardSub: { en: 'Brrr! Mind the dogs', de: 'Brrr! Vorsicht, Hunde!', el: 'Μπρρρ! Προσοχή στα σκυλιά' },
    // --- stage 2
    s2a: { en: "Tyre tracks! And they're fresh...", de: 'Reifenspuren! Und die sind ganz frisch...', el: 'Ίχνη από λάστιχα! Και είναι φρέσκα...' },
    s2b: { en: 'MEOW-HAHA! Step on it, Mittens!', de: 'MIAU-HAHA! Gib Gas, Mieze!', el: 'ΝΙΑΟΥ-ΧΑΧΑ! Πάτα γκάζι, Ψιψίνα!' },
    s2c: { en: "Cats?! Driving a VAN?! With Santa's sack!", de: 'Katzen?! In einem LIEFERWAGEN?! Mit dem Sack vom Weihnachtsmann!', el: 'Γάτες;! Που οδηγούν ΦΟΡΤΗΓΑΚΙ;! Με τον σάκο του Αϊ-Βασίλη!' },
    s2d: { en: 'Good thing I got a skateboard LAST Christmas. After them!', de: 'Zum Glück hab ich LETZTES Weihnachten ein Skateboard bekommen. Hinterher!', el: 'Ευτυχώς που ΠΕΡΣΙ τα Χριστούγεννα πήρα σκέιτμπορντ. Πάμε!' },
    sb1: { en: "I'm BACK! And I'm ROUNDER!", de: 'Ich bin ZURÜCK! Und ich bin RUNDER!', el: 'ΓΥΡΙΣΑ! Και είμαι πιο ΣΤΡΟΓΓΥΛΟΣ!' },
    sb2: { en: 'Slushman?! But you melted!', de: 'Matschmann?! Du bist doch geschmolzen!', el: 'Λασποχιονά;! Μα εσύ έλιωσες!' },
    sb3: { en: 'I got BETTER. Snowball Express, coming through!', de: "Mir geht's WIEDER GUT. Schneeball-Express, Bahn frei!", el: 'ΞΑΝΑΠΑΓΩΣΑ. Χιονόμπαλα-Εξπρές, κάντε στην άκρη!' },
    sb4: { en: 'Is that... a ROAD SALT truck?! The Boss will nev—', de: 'Ist das... ein STREUSALZ-Laster?! Der Boss wird nie—', el: 'Αυτό είναι... φορτηγό με ΑΛΑΤΙ;! Το Αφεντικό δεν θα—' },
    sb5: { en: 'SPLASH.', de: 'PLATSCH.', el: 'ΠΛΑΤΣ.' },
    sb6: { en: 'The van got away... but it dropped something.', de: 'Der Lieferwagen ist entkommen... aber er hat etwas verloren.', el: 'Το φορτηγάκι ξέφυγε... αλλά του έπεσε κάτι.' },
    sb7: { en: 'A delivery note with a paw print: "Pick-up: Town Square Clock Tower."', de: 'Ein Lieferschein mit Pfotenabdruck: „Abholung: Uhrturm am Marktplatz.“', el: 'Ένα δελτίο παράδοσης με αποτύπωμα πατούσας: «Παραλαβή: Πύργος του Ρολογιού, Κεντρική Πλατεία.»' },
    sb8: { en: 'The clock tower! Time for some detective work.', de: 'Der Uhrturm! Zeit für Detektivarbeit.', el: 'Ο Πύργος του Ρολογιού! Ώρα για ντετέκτιβ.' },
    tipRun: { en: '↑ ↓ change lane · Space jump · hold X to duck', de: '↑ ↓ Spur wechseln · Leertaste springen · X halten: ducken', el: '↑ ↓ αλλαγή λωρίδας · Space άλμα · κράτα X για σκύψιμο' },
    tLow: { en: 'Snowman ahead: jump or change lane!', de: 'Schneemann voraus: springen oder Spur wechseln!', el: 'Χιονάνθρωπος μπροστά: πήδα ή άλλαξε λωρίδα!' },
    tHigh: { en: 'Low-hanging lights: hold X to duck!', de: 'Tief hängende Lichterkette: X halten und ducken!', el: 'Χαμηλά λαμπάκια: κράτα X και σκύψε!' },
    tTall: { en: 'Inflatable Santa: change lane!', de: 'Aufblas-Weihnachtsmann: Spur wechseln!', el: 'Φουσκωτός Αϊ-Βασίλης: άλλαξε λωρίδα!' },
    tIce: { en: 'Ice: no lane changes while you slide!', de: 'Eis: beim Rutschen kein Spurwechsel!', el: 'Πάγος: δεν αλλάζεις λωρίδα όσο γλιστράς!' },
    tRamp: { en: 'Ramp ahead: big air and cookies!', de: 'Rampe voraus: hoch hinaus zu den Plätzchen!', el: 'Ράμπα μπροστά: ψηλό άλμα και μπισκότα!' },
    tRail: { en: 'Jump onto the fence rail to grind!', de: 'Spring aufs Geländer und grinde!', el: 'Πήδα πάνω στο κάγκελο και γλίστρα!' },
    tBossRamp: { en: 'Take the ramps! Slushman will follow you into the air.', de: 'Nimm die Rampen! Matschmann fliegt dir hinterher.', el: 'Πάρε τις ράμπες! Ο Λασποχιονάς θα σε ακολουθήσει στον αέρα.' },
    stage2: { en: 'STAGE 2', de: 'LEVEL 2', el: 'ΠΙΣΤΑ 2' },
    stage2Sub: { en: 'Downhill Dash', de: 'Schussfahrt', el: 'Κατηφόρα και γκάζι' },
    bossBanner: { en: 'SNOWBALL EXPRESS', de: 'SCHNEEBALL-EXPRESS', el: 'ΧΙΟΝΟΜΠΑΛΑ-ΕΞΠΡΕΣ' },
    nCat: { en: 'Cat driver', de: 'Katze am Steuer', el: 'Γάτα οδηγός' },
    pGrind: { en: 'GRIND!', de: 'GRIND!', el: 'ΓΛΙΣΤΡΑ!' },
    pAir: { en: 'BIG AIR!', de: 'HOCH HINAUS!', el: 'ΨΗΛΑ!' },
    pMissed: { en: 'MISSED!', de: 'VERPASST!', el: 'ΤΗΝ ΕΧΑΣΕΣ!' },
    pLa: { en: 'LA LA!', de: 'LA LA!', el: 'ΛΑ ΛΑ!' },
    pHonk: { en: 'HONK!', de: 'TUUT!', el: 'ΜΠΙΠ!' },
    pSplash: { en: 'SPLASH!', de: 'PLATSCH!', el: 'ΠΛΑΤΣ!' },
    pSalt: { en: 'SALT', de: 'SALZ', el: 'ΑΛΑΤΙ' },
    // --- stage 4
    f1: { en: "Whoa! Easy, sleigh! ...Okay. Okay! I'm FLYING!", de: 'Hooo! Ruhig, Schlitten! ...Okay. Okay! Ich FLIEGE!', el: 'Ωπα! Σιγά, έλκηθρο! ...Εντάξει. Εντάξει! ΠΕΤΑΩ!' },
    f2: { en: 'The snow-globe navigator blinks: Santa is somewhere up ahead, and moving fast.', de: 'Das Schneekugel-Navi blinkt: Der Weihnachtsmann ist irgendwo da vorn, und er bewegt sich schnell.', el: 'Ο πλοηγός-χιονόμπαλα αναβοσβήνει: ο Αϊ-Βασίλης είναι κάπου μπροστά και κινείται γρήγορα.' },
    f3: { en: "Presents are good for throwing, right? Sorry, everyone. It's for Christmas!", de: 'Geschenke kann man doch prima werfen, oder? Tut mir leid, Leute. Es ist für Weihnachten!', el: 'Τα δώρα πετιούνται μια χαρά, έτσι; Συγγνώμη, παιδιά. Είναι για τα Χριστούγεννα!' },
    m1: { en: "Surprise! I evaporated... and now I'm a CLOUD. Way more powerful!", de: 'Überraschung! Ich bin verdampft... und jetzt bin ich eine WOLKE. Viel mächtiger!', el: 'Έκπληξη! Εξατμίστηκα... και τώρα είμαι ΣΥΝΝΕΦΟ. Πολύ πιο δυνατός!' },
    m2: { en: 'Do you EVER give up?', de: 'Gibst du eigentlich NIE auf?', el: 'Δεν τα παρατάς ΠΟΤΕ;' },
    m3: { en: 'Never! And now, the weather forecast: ME!', de: 'Niemals! Und jetzt das Wetter: ICH!', el: 'Ποτέ! Και τώρα το δελτίο καιρού: ΕΓΩ!' },
    m4: { en: "Noooo! I'm just... drizzle now. The Boss will nev—", de: 'Neiiin! Ich bin nur noch... Nieselregen. Der Boss wird nie—', el: 'Όχιιι! Έγινα... ψιχάλα. Το Αφεντικό δεν θα—' },
    m5: { en: 'POOF.', de: 'PUFF.', el: 'ΠΑΦ.' },
    h1: { en: "A flying... CAT?! That's the biggest balloon I've ever seen!", de: 'Eine fliegende... KATZE?! Das ist der größte Ballon, den ich je gesehen habe!', el: 'Μια ιπτάμενη... ΓΑΤΑ;! Είναι το πιο μεγάλο μπαλόνι που έχω δει!' },
    h2: { en: "Hee hee! Welcome aboard the HAIRBALL, little human. You're too late!", de: 'Hihi! Willkommen an Bord der HAARBALL, kleiner Mensch. Du kommst zu spät!', el: 'Χι χι! Καλώς ήρθες στο ΤΡΙΧΟΜΠΑΛΟ, ανθρωπάκι. Άργησες!' },
    h3: { en: 'That voice... I KNOW that voice.', de: 'Diese Stimme... Ich KENNE diese Stimme.', el: 'Αυτή η φωνή... την ΞΕΡΩ αυτή τη φωνή.' },
    h4: { en: 'My ship! My beautiful ship! Abandon blimp!', de: 'Mein Schiff! Mein schönes Schiff! Alle Pfoten von Bord!', el: 'Το σκάφος μου! Το όμορφο σκάφος μου! Εγκαταλείψτε το μπαλόνι!' },
    h5: { en: "It's going down... right on top of... wait. That's MY roof!", de: 'Es stürzt ab... genau auf... Moment. Das ist MEIN Dach!', el: 'Πέφτει... ακριβώς πάνω σε... στάσου. Αυτή είναι η ΔΙΚΗ ΜΟΥ στέγη!' },
    tFly: { en: 'Arrows fly · hold X: throw presents · hold Space, then release: Mega Present', de: 'Pfeile: fliegen · X halten: Geschenke · Leertaste halten, loslassen: Mega-Geschenk', el: 'Βέλη: πτήση · κράτα X: δώρα · κράτα Space κι άφησε: Μέγα-Δώρο' },
    tStar: { en: 'The tree star blocks shots! V sends it ahead and calls it back.', de: 'Der Baumstern blockt Schüsse! V schickt ihn voraus und holt ihn zurück.', el: 'Το αστέρι μπλοκάρει βολές! Με V το στέλνεις μπροστά και το καλείς πίσω.' },
    tClouds: { en: 'Above the clouds: watch out for icicles!', de: 'Über den Wolken: Vorsicht, Eiszapfen!', el: 'Πάνω από τα σύννεφα: πρόσεχε τους παγοκρυστάλλους!' },
    tBell: { en: 'Only the collar bell can be hurt. Aim for it!', de: 'Nur das Glöckchen am Halsband ist verwundbar. Ziel drauf!', el: 'Μόνο το κουδουνάκι στο κολάρο παθαίνει ζημιά. Στόχευσέ το!' },
    stage4: { en: 'STAGE 4', de: 'LEVEL 4', el: 'ΠΙΣΤΑ 4' },
    stage4Sub: { en: 'Sleigh Ride of Doom', de: 'Schlittenfahrt ins Verderben', el: 'Ελκηθροδρομία του χαμού' },
    nStorm: { en: 'STORMY SLUSHMAN', de: 'WOLKEN-MATSCHMANN', el: 'ΣΥΝΝΕΦΟ-ΛΑΣΠΟΧΙΟΝΑΣ' },
    nShip: { en: 'THE HAIRBALL', de: 'DIE HAARBALL', el: 'ΤΟ ΤΡΙΧΟΜΠΑΛΟ' },
    pTink: { en: 'TINK!', de: 'KLING!', el: 'ΝΤΙΝ!' },
    pShield: { en: 'SHIELD!', de: 'SCHILD!', el: 'ΑΣΠΙΔΑ!' },
    pStar: { en: 'STAR!', de: 'STERN!', el: 'ΑΣΤΕΡΙ!' },
    pSpread: { en: 'JINGLE SHOT!', de: 'GLOCKENSCHUSS!', el: 'ΤΡΙΠΛΗ ΒΟΛΗ!' },
    tPierce: { en: 'Cane Laser! Your shots are now fast beams that go straight through enemies.', de: 'Zucker-Laser! Deine Schüsse sind jetzt schnelle Strahlen, die durch Gegner hindurchgehen.', el: 'Ζαχαρο-λέιζερ! Οι βολές σου είναι τώρα γρήγορες ακτίνες που περνούν μέσα από τους εχθρούς.' },
    pPierce: { en: 'CANE LASER!', de: 'ZUCKER-LASER!', el: 'ΖΑΧΑΡΟ-ΛΕΪΖΕΡ!' },
    pCoo: { en: 'COO!', de: 'GURR!', el: 'ΓΚΟΥ!' },
    pZap: { en: 'ZAP!', de: 'ZAPP!', el: 'ΖΑΠ!' },
    pMega: { en: 'MEGA!', de: 'MEGA!', el: 'ΜΕΓΑ!' },
    // --- stage 5
    a1: { en: 'Oof! The chimney comes out... in our ATTIC? Who builds a house like this?', de: 'Uff! Der Kamin endet... auf unserem DACHBODEN? Wer baut denn so ein Haus?', el: 'Ουφ! Η καμινάδα βγάζει... στη ΣΟΦΙΤΑ μας; Ποιος χτίζει τέτοια σπίτια;' },
    a2: { en: "Cardboard towers, scratching posts, yarn everywhere... someone's been busy up here.", de: 'Kartontürme, Kratzbäume, überall Wolle... hier oben war jemand fleißig.', el: 'Πύργοι από χαρτόκουτα, ξύστρες, κουβάρια παντού... κάποιος είχε πολλή δουλειά εδώ πάνω.' },
    a3: { en: '{name} still has the star from the Christmas tree. Press V to throw it. It comes back!', de: '{name} hat noch den Stern vom Weihnachtsbaum. Drück V, um ihn zu werfen. Er kommt zurück!', el: 'Ο {name} έχει ακόμα το αστέρι του δέντρου. Πάτα V για να το ρίξεις. Γυρίζει πίσω!' },
    c1: { en: 'Psst! Sock-wearer! Down here. In the water bowl.', de: 'Psst! Sockenträger! Hier unten. Im Wassernapf.', el: 'Ψιτ! Μικρέ με τις κάλτσες! Εδώ κάτω. Στο μπολ με το νερό.' },
    c2: { en: "Slushman?! You're an ICE CUBE.", de: 'Matschmann?! Du bist ein EISWÜRFEL.', el: 'Λασποχιονά;! Έγινες ΠΑΓΑΚΙ.' },
    c3: { en: 'I QUIT! Seven stages of melting, and she pays me in KIBBLE! Here: one ice step, on the house.', de: 'Ich KÜNDIGE! Sieben Level lang schmelzen, und sie bezahlt mich mit TROCKENFUTTER! Hier: eine Eisstufe, geht aufs Haus.', el: 'ΠΑΡΑΙΤΟΥΜΑΙ! Εφτά πίστες λιώσιμο και με πληρώνει με ΚΡΟΚΕΤΕΣ! Ορίστε: ένα σκαλί από πάγο, κερασμένο.' },
    c4: { en: 'Now go. And tell Santa I want a scarf. A WARM one. Wait, no—', de: 'Jetzt geh. Und sag dem Weihnachtsmann, ich will einen Schal. Einen WARMEN. Moment, nein—', el: 'Πήγαινε τώρα. Και πες στον Αϊ-Βασίλη ότι θέλω ένα κασκόλ. ΖΕΣΤΟ. Στάσου, όχι—' },
    d1: { en: 'So. The little human finally made it.', de: 'So. Der kleine Mensch hat es also geschafft.', el: 'Λοιπόν. Το ανθρωπάκι τα κατάφερε επιτέλους.' },
    d2: { en: "DUCHESS?! YOU'RE The Boss?! You're MY CAT!", de: 'DUCHESS?! DU bist der Boss?! Du bist MEINE KATZE!', el: 'ΔΟΥΚΙΣΣΑ;! ΕΣΥ είσαι το Αφεντικό;! Είσαι Η ΓΑΤΑ ΜΟΥ!' },
    d3: { en: 'Every year: the itchy reindeer sweater. The family photo. And how many presents for me? ZERO.', de: 'Jedes Jahr: der kratzige Rentierpulli. Das Familienfoto. Und wie viele Geschenke für mich? NULL.', el: 'Κάθε χρόνο: το πουλόβερ-τάρανδος που τσιμπάει. Η οικογενειακή φωτογραφία. Και πόσα δώρα για μένα; ΜΗΔΕΝ.' },
    d4: { en: 'So this year, ALL the presents are mine. Vacu-Mech 3000... ENGAGE!', de: 'Also gehören dieses Jahr ALLE Geschenke mir. Saug-Mech 3000... START!', el: 'Φέτος λοιπόν ΟΛΑ τα δώρα είναι δικά μου. Σκουπο-Μεχ 3000... ΕΜΠΡΟΣ!' },
    d5: { en: "My mech! ...Fine. We'll do this the old-fashioned way. ZOOMIES!", de: 'Mein Mech! ...Na gut. Dann eben auf die altmodische Art. FLITZ-ATTACKE!', el: 'Το ρομπότ μου! ...Καλά. Θα το κάνουμε με τον παλιό τρόπο. ΤΡΕΛΟ ΤΡΕΞΙΜΟ!' },
    e1: { en: '(pant, pant) ...Enough. I give up. I just... wanted ONE present. Just one.', de: '(hechel, hechel) ...Genug. Ich gebe auf. Ich wollte doch nur... EIN Geschenk. Nur eins.', el: '(λαχάνιασμα) ...Φτάνει. Παραδίνομαι. Ήθελα μόνο... ΕΝΑ δώρο. Μόνο ένα.' },
    e2: { en: 'Ho ho... ho? Why am I in a box? And why am I wearing a SWEATER?', de: 'Ho ho... ho? Warum bin ich in einem Karton? Und warum trage ich einen PULLI?', el: 'Χο χο... χο; Γιατί είμαι μέσα σε κουτί; Και γιατί φοράω ΠΟΥΛΟΒΕΡ;' },
    e3: { en: "Santa! You're okay! Duchess hypnotized you with a laser pointer.", de: 'Weihnachtsmann! Dir geht es gut! Duchess hat dich mit einem Laserpointer hypnotisiert.', el: 'Αϊ-Βασίλη! Είσαι καλά! Η Δούκισσα σε υπνώτισε με ένα λέιζερ.' },
    e4: { en: "Ah. That explains the red dot I've been chasing. Duchess... nobody should go without a present.", de: 'Ah. Das erklärt den roten Punkt, dem ich nachgelaufen bin. Duchess... niemand sollte ohne Geschenk bleiben.', el: 'Α. Αυτό εξηγεί την κόκκινη κουκκίδα που κυνηγούσα. Δούκισσα... κανείς δεν πρέπει να μένει χωρίς δώρο.' },
    e5: { en: 'This one is for you.', de: 'Das hier ist für dich.', el: 'Αυτό είναι για σένα.' },
    e6: { en: 'Santa gives Duchess... the empty box.', de: 'Der Weihnachtsmann schenkt Duchess... den leeren Karton.', el: 'Ο Αϊ-Βασίλης δίνει στη Δούκισσα... το άδειο κουτί.' },
    e7: { en: "...It's PERFECT. (purr)", de: '...Er ist PERFEKT. (schnurr)', el: '...Είναι ΤΕΛΕΙΟ. (γουργούρισμα)' },
    e8: { en: 'No more sweaters, Duchess. I promise.', de: 'Keine Pullis mehr, Duchess. Versprochen.', el: 'Τέρμα τα πουλόβερ, Δούκισσα. Το υπόσχομαι.' },
    e9: { en: 'Now then! We have a LOT of deliveries to catch up on. Merry Christmas, {name}!', de: 'Also dann! Wir haben eine MENGE Lieferungen nachzuholen. Frohe Weihnachten, {name}!', el: 'Λοιπόν! Έχουμε ΠΟΛΛΕΣ παραδόσεις να προλάβουμε. Καλά Χριστούγεννα, {name}!' },
    e10: { en: '(wearing a present as a hat) ...Thanks. Stage 9? Call me.', de: '(mit einem Geschenk als Hut) ...Danke auch. Level 9? Ruft mich an.', el: '(φορώντας ένα δώρο για καπέλο) ...Ευχαριστώ πολύ. Πίστα 9; Πάρτε με τηλέφωνο.' },
    tStar5: { en: 'Press V to throw the tree star. It comes back!', de: 'Mit V wirfst du den Baumstern. Er kommt zurück!', el: 'Με V ρίχνεις το αστέρι. Γυρίζει πίσω!' },
    tDots: { en: "Don't step on the laser dots: they scramble your controls!", de: 'Tritt nicht auf die Laserpunkte: Sie bringen deine Steuerung durcheinander!', el: 'Μην πατάς τις κουκκίδες λέιζερ: ανακατεύουν τον χειρισμό σου!' },
    tMech: { en: 'Jump the low beams, stay down for the high ones. Bonk the mech between attacks!', de: 'Über tiefe Strahlen springen, bei hohen unten bleiben. Hau den Mech zwischen den Angriffen!', el: 'Πήδα τις χαμηλές ακτίνες, μείνε κάτω στις ψηλές. Χτύπα το ρομπότ ανάμεσα στις επιθέσεις!' },
    stage5: { en: 'STAGE 5', de: 'LEVEL 5', el: 'ΠΙΣΤΑ 5' },
    stage5Sub: { en: 'Cat-astrophe in the Attic', de: 'Katz-astrophe auf dem Dachboden', el: 'Γατο-στροφή στη σοφίτα' },
    nMech: { en: 'VACU-MECH 3000', de: 'SAUG-MECH 3000', el: 'ΣΚΟΥΠΟ-ΜΕΧ 3000' },
    nDuch: { en: 'DUCHESS', de: 'DUCHESS', el: 'ΔΟΥΚΙΣΣΑ' },
    nDuchess: { en: 'Duchess', de: 'Duchess', el: 'Δούκισσα' },
    pDizzy: { en: 'DIZZY!', de: 'SCHWINDEL!', el: 'ΖΑΛΑΔΑ!' },
    pVrr: { en: 'VRRRR!', de: 'VRRRR!', el: 'ΒΡΡΡΡ!' },
    pZoom: { en: 'ZOOMIES!', de: 'FLITZ!', el: 'ΤΡΕΧΑΛΑ!' },
    pPurr: { en: 'PURRR', de: 'SCHNURR', el: 'ΓΟΥΡ ΓΟΥΡ' },
    // --- stage 3
    q1: { en: "Town Square. The delivery note says 'Clock Tower'... and it's stamped with a paw print. A paw with a tiny STAR in the middle.", de: 'Der Marktplatz. Auf dem Lieferschein steht „Uhrturm“... und darauf ist ein Pfotenabdruck. Eine Pfote mit einem kleinen STERN in der Mitte.', el: 'Η Κεντρική Πλατεία. Το δελτίο γράφει «Πύργος του Ρολογιού»... και έχει μια σφραγίδα-πατούσα. Μια πατούσα με ένα μικρό ΑΣΤΕΡΙ στη μέση.' },
    q2: { en: 'Time to investigate. Detective {name} is on the case!', de: 'Zeit für Ermittlungen. Detektiv {name} übernimmt den Fall!', el: 'Ώρα για έρευνα. Ο ντετέκτιβ {name} αναλαμβάνει την υπόθεση!' },
    q3: { en: 'Click things to look, talk and take. To use an item, click it in your bag, then click a target.', de: 'Klick Dinge an, um sie anzusehen, zu reden oder sie zu nehmen. Zum Benutzen: erst den Gegenstand in der Tasche anklicken, dann das Ziel.', el: 'Κάνε κλικ για να κοιτάξεις, να μιλήσεις ή να πάρεις κάτι. Για να χρησιμοποιήσεις ένα αντικείμενο: κλικ στην τσάντα και μετά στον στόχο.' },
    x1: { en: "That doesn't work here.", de: 'Das funktioniert hier nicht.', el: 'Αυτό δεν κάνει εδώ.' },
    x2: { en: 'Just milk and butter now.', de: 'Jetzt nur noch Milch und Butter.', el: 'Τώρα έχει μόνο γάλα και βούτυρο.' },
    x3: { en: 'Cat food. Three brands, three different paw logos.', de: 'Katzenfutter. Drei Marken, drei verschiedene Pfoten-Logos.', el: 'Γατοτροφή. Τρεις μάρκες, τρία διαφορετικά σήματα με πατούσα.' },
    g1: { en: "Ho ho ho! I'm Santa! The REAL one. Definitely.", de: 'Ho ho ho! Ich bin der Weihnachtsmann! Der ECHTE. Ganz sicher.', el: 'Χο χο χο! Είμαι ο Αϊ-Βασίλης! Ο ΑΛΗΘΙΝΟΣ. Σίγουρα.' },
    g2: { en: 'Your beard is on upside down.', de: 'Dein Bart ist verkehrt herum.', el: 'Τα γένια σου είναι ανάποδα.' },
    g3: { en: "...It's the fashion. Looking for the clock tower? It's haunted. By a giant pigeon. True story.", de: '...Das trägt man jetzt so. Du suchst den Uhrturm? Da spukt es. Eine Riesentaube. Wahre Geschichte.', el: '...Είναι της μόδας. Ψάχνεις τον Πύργο του Ρολογιού; Είναι στοιχειωμένος. Από ένα γιγάντιο περιστέρι. Αληθινή ιστορία.' },
    g4: { en: 'Here, have a cocoa. On the house. I have nine.', de: 'Hier, nimm einen Kakao. Geht aufs Haus. Ich hab neun.', el: 'Πάρε ένα κακάο. Κερνάω. Έχω εννιά.' },
    g5: { en: 'Hot tip, kid: that paw print? Reindeer. Reindeer have paws. Probably.', de: 'Heißer Tipp, Kleiner: der Pfotenabdruck? Rentier. Rentiere haben Pfoten. Wahrscheinlich.', el: 'Μυστικό, μικρέ: η πατούσα; Τάρανδος. Οι τάρανδοι έχουν πατούσες. Μάλλον.' },
    t1: { en: "S-s-so c-cold! The heating broke. I'd trade my b-best wind-up mouse for something hot.", de: 'S-s-so k-kalt! Die Heizung ist kaputt. Für etwas Heißes gäbe ich meine b-beste Aufziehmaus her.', el: 'Τ-τ-τι κ-κρύο! Χάλασε η θέρμανση. Θα έδινα το κ-καλύτερο κουρδιστό μου ποντίκι για κάτι ζεστό.' },
    t2: { en: 'Cocoa! Bless you. Here, the mouse is yours. Cats go CRAZY for it.', de: 'Kakao! Du bist ein Schatz. Hier, die Maus gehört dir. Katzen sind VERRÜCKT danach.', el: 'Κακάο! Να είσαι καλά. Ορίστε, το ποντίκι είναι δικό σου. Οι γάτες ΤΡΕΛΑΙΝΟΝΤΑΙ.' },
    t3: { en: 'Aaah. I can feel my toes again.', de: 'Aaah. Ich spüre meine Zehen wieder.', el: 'Ααα. Ξανανιώθω τα δάχτυλα των ποδιών μου.' },
    t4: { en: "A shiny bauble. The sign says 'Free with every visit.' Shiny things are always useful.", de: 'Eine glänzende Christbaumkugel. Auf dem Schild steht: „Gratis bei jedem Besuch.“ Glänzendes kann man immer brauchen.', el: 'Μια γυαλιστερή μπάλα. Η ταμπέλα λέει «Δώρο σε κάθε επίσκεψη». Τα γυαλιστερά πάντα χρειάζονται.' },
    t5: { en: 'Wind-up mice, teddy bears, tiny sleighs. No real sleigh, though.', de: 'Aufziehmäuse, Teddybären, winzige Schlitten. Aber kein echter Schlitten.', el: 'Κουρδιστά ποντίκια, αρκουδάκια, μικροσκοπικά έλκηθρα. Αληθινό έλκηθρο όμως πουθενά.' },
    b1: { en: "That cat has been sitting on my gingerbread ALL morning! I'd shoo it away, but it bites.", de: 'Diese Katze sitzt schon den GANZEN Morgen auf meinem Lebkuchen! Ich würde sie verscheuchen, aber sie beißt.', el: 'Αυτή η γάτα κάθεται ΟΛΟ το πρωί πάνω στα μελομακάρονά μου! Θα την έδιωχνα, αλλά δαγκώνει.' },
    b2: { en: "The wind-up mouse whirrs across the floor. The cat's eyes go wide...", de: 'Die Aufziehmaus surrt über den Boden. Die Katze macht große Augen...', el: 'Το κουρδιστό ποντίκι τρέχει στο πάτωμα. Τα μάτια της γάτας γουρλώνουν...' },
    b3: { en: 'My hero! Take these crackers. Fresh, crunchy, parrot-approved.', de: 'Mein Held! Nimm diese Cracker. Frisch, knusprig, vom Papagei empfohlen.', el: 'Ήρωά μου! Πάρε αυτά τα κράκερ. Φρέσκα, τραγανά, εγκεκριμένα από παπαγάλο.' },
    b4: { en: 'Peace at last. And only slightly furry gingerbread!', de: 'Endlich Ruhe. Und nur leicht haariger Lebkuchen!', el: 'Επιτέλους ησυχία. Και μόνο λίγο τριχωτά μελομακάρονα!' },
    b5: { en: 'Nice kitty... OW! It really does bite.', de: 'Liebes Kätzchen... AU! Die beißt wirklich.', el: 'Καλή γατούλα... ΑΟΥ! Όντως δαγκώνει.' },
    s1: { en: "Psst. In here. It's me: Slushman. I'm a SLUSHY now, and this fridge is too WARM. Freezer. Please.", de: 'Psst. Hier drin. Ich bin es: Matschmann. Ich bin jetzt ein SLUSHY, und dieser Kühlschrank ist zu WARM. Gefriertruhe. Bitte.', el: 'Ψιτ. Εδώ μέσα. Εγώ είμαι: ο Λασποχιονάς. Έγινα ΓΡΑΝΙΤΑ και αυτό το ψυγείο είναι πολύ ΖΕΣΤΟ. Στον καταψύκτη. Σε παρακαλώ.' },
    s2: { en: 'Ahhh. Bliss. Fine, a tip: the tower door wants what the parrot heard and what the cats eat. And Sir Whiskerton? Loves flattery.', de: 'Ahhh. Herrlich. Na gut, ein Tipp: Die Turmtür will wissen, was der Papagei gehört hat und was die Katzen fressen. Und Sir Whiskerton? Liebt Schmeicheleien.', el: 'Ααα. Ευτυχία. Καλά, μια συμβουλή: η πόρτα του πύργου θέλει αυτό που άκουσε ο παπαγάλος κι αυτό που τρώνε οι γάτες. Κι ο σερ Γουίσκερτον; Λατρεύει τις κολακείες.' },
    s3: { en: "Slushman is snoring in there. Let's not wake him.", de: 'Matschmann schnarcht da drin. Lieber nicht wecken.', el: 'Ο Λασποχιονάς ροχαλίζει εκεί μέσα. Ας μην τον ξυπνήσουμε.' },
    f0: { en: 'A freezer. Full of ice cream cake. Focus, detective.', de: 'Eine Gefriertruhe. Voller Eistorte. Konzentration, Detektiv.', el: 'Ένας καταψύκτης. Γεμάτος τούρτα παγωτό. Συγκεντρώσου, ντετέκτιβ.' },
    k1: { en: 'Welcome to Purrfect Pets! What can I do for you?', de: 'Willkommen bei Purrfect Pets! Was kann ich für dich tun?', el: 'Καλώς ήρθες στο Purrfect Pets! Τι μπορώ να κάνω για σένα;' },
    k2: { en: 'Do you know this paw print? It has a star in the middle.', de: 'Kennen Sie diesen Pfotenabdruck? Er hat einen Stern in der Mitte.', el: 'Ξέρετε αυτή την πατούσα; Έχει ένα αστέρι στη μέση.' },
    k3: { en: "That's a cat-food logo! One of the three brands on my shelf. Have a look.", de: 'Das ist ein Katzenfutter-Logo! Eine der drei Marken in meinem Regal. Schau mal nach.', el: 'Αυτό είναι σήμα γατοτροφής! Μία από τις τρεις μάρκες στο ράφι μου. Ρίξε μια ματιά.' },
    k4: { en: 'Look closely: that logo is different from the one on your note.', de: 'Schau genau hin: Dieses Logo ist anders als das auf deinem Zettel.', el: 'Κοίτα προσεκτικά: αυτό το σήμα διαφέρει από εκείνο στο χαρτί σου.' },
    k5: { en: 'Fancy Paws! Only ONE customer buys that: the cats up in the clock tower. They pay in yarn.', de: 'Fancy Paws! Das kauft nur EIN Kunde: die Katzen oben im Uhrturm. Sie bezahlen mit Wolle.', el: 'Fancy Paws! Μόνο ΕΝΑΣ πελάτης το αγοράζει: οι γάτες στον Πύργο του Ρολογιού. Πληρώνουν με κουβάρια.' },
    k6: { en: 'Fancy Paws is the one with the star. Case closed.', de: 'Fancy Paws ist die Marke mit dem Stern. Fall gelöst.', el: 'Το Fancy Paws είναι αυτό με το αστέρι. Λύθηκε.' },
    k7: { en: 'Say hi to the tower cats. Actually, no. They still owe me yarn.', de: 'Grüß die Turmkatzen von mir. Oder nein. Die schulden mir noch Wolle.', el: 'Χαιρετίσματα στις γάτες του πύργου. Ή μάλλον όχι. Μου χρωστάνε κουβάρια.' },
    p1: { en: 'SQUAWK! Polly knows a SECRET! Polly wants a CRACKER!', de: 'KRAH! Polly kennt ein GEHEIMNIS! Polly will einen CRACKER!', el: 'ΚΡΑ! Η Πόλυ ξέρει ένα ΜΥΣΤΙΚΟ! Η Πόλυ θέλει ΚΡΑΚΕΡ!' },
    p2: { en: 'CRUNCH! SQUAWK! FOUR HUNDRED LASER POINTERS! PASSWORD: JINGLE WHISKERS! SQUAWK!', de: 'KNUSPER! KRAH! VIERHUNDERT LASERPOINTER! PASSWORT: SCHNURR-GLÖCKCHEN! KRAH!', el: 'ΚΡΑΤΣ! ΚΡΑ! ΤΕΤΡΑΚΟΣΙΑ ΛΕΪΖΕΡ! ΣΥΝΘΗΜΑΤΙΚΟ: ΚΟΥΔΟΥΝΟ-ΜΟΥΣΤΑΚΗΣ! ΚΡΑ!' },
    p3: { en: 'REINDEER STARE AT THE DOT! SHINY THING BREAKS THE SPELL! SQUAWK!', de: 'RENTIERE STARREN AUF DEN PUNKT! GLITZERDING BRICHT DEN BANN! KRAH!', el: 'ΟΙ ΤΑΡΑΝΔΟΙ ΚΟΙΤΑΝΕ ΤΗΝ ΚΟΥΚΚΙΔΑ! ΤΟ ΓΥΑΛΙΣΤΕΡΟ ΛΥΝΕΙ ΤΑ ΜΑΓΙΑ! ΚΡΑ!' },
    p4: { en: 'JINGLE WHISKERS! SHINY THING! SQUAWK!', de: 'SCHNURR-GLÖCKCHEN! GLITZERDING! KRAH!', el: 'ΚΟΥΔΟΥΝΟ-ΜΟΥΣΤΑΚΗΣ! ΓΥΑΛΙΣΤΕΡΟ! ΚΡΑ!' },
    dr0: { en: "I don't know the password yet. Somebody in town must have overheard it.", de: 'Ich kenne das Passwort noch nicht. Irgendwer in der Stadt muss es aufgeschnappt haben.', el: 'Δεν ξέρω ακόμα το συνθηματικό. Κάποιος στην πόλη θα το έχει ακούσει.' },
    dr1: { en: 'MEOW. Deliveries only. Password?', de: 'MIAU. Nur Lieferungen. Passwort?', el: 'ΝΙΑΟΥ. Μόνο παραδόσεις. Συνθηματικό;' },
    drPw: { en: ['Silent Bite', 'Jingle Whiskers', 'Deck the Paws'], de: ['Stille Tatze', 'Schnurr-Glöckchen', 'Oh Tannenmaus'], el: ['Άγια Πατούσα', 'Κουδουνο-Μουστάκης', 'Έλατο και Ψάρι'] },
    dr2: { en: 'HISS. Wrong.', de: 'FAUCH. Falsch.', el: 'ΦΣΣ. Λάθος.' },
    dr3: { en: 'And what do we eat up here?', de: 'Und was fressen wir hier oben?', el: 'Και τι τρώμε εμείς εδώ πάνω;' },
    dr4: { en: "I don't know what the tower cats eat. The paw print on the note might tell me.", de: 'Ich weiß nicht, was die Turmkatzen fressen. Der Pfotenabdruck auf dem Zettel könnte es verraten.', el: 'Δεν ξέρω τι τρώνε οι γάτες του πύργου. Ίσως το δείχνει η πατούσα στο χαρτί.' },
    drBrand: { en: ['Kitty Crunch', 'Fancy Paws', 'Whisker Bites'], de: ['Kitty Crunch', 'Fancy Paws', 'Whisker Bites'], el: ['Kitty Crunch', 'Fancy Paws', 'Whisker Bites'] },
    dr5: { en: 'Last one. It runs all day long, but never leaves its place. What is it?', de: 'Die letzte Frage. Sie läuft den ganzen Tag und kommt doch nie vom Fleck. Was ist das?', el: 'Η τελευταία. Τρέχει όλη μέρα, αλλά δεν φεύγει ποτέ από τη θέση του. Τι είναι;' },
    drClock: { en: ['A clock', 'A delivery van', 'A reindeer'], de: ['Eine Uhr', 'Ein Lieferwagen', 'Ein Rentier'], el: ['Το ρολόι', 'Ένα φορτηγάκι', 'Ένας τάρανδος'] },
    dr6: { en: 'Purr. Enter.', de: 'Schnurr. Eintreten.', el: 'Γουρ. Πέρασε.' },
    l1: { en: "The sleigh! And the reindeer! ...And a very naked cat.", de: 'Der Schlitten! Und die Rentiere! ...Und eine sehr nackte Katze.', el: 'Το έλκηθρο! Και οι τάρανδοι! ...Και μια πολύ γυμνή γάτα.' },
    w1: { en: 'Halt! I am Sir Whiskerton, Keeper of the Sleigh. Answer my three riddles, or taste my hairball.', de: 'Halt! Ich bin Sir Whiskerton, Hüter des Schlittens. Löse meine drei Rätsel, oder koste meinen Haarball.', el: 'Αλτ! Είμαι ο σερ Γουίσκερτον, Φύλακας του Έλκηθρου. Λύσε τα τρία μου αινίγματα, αλλιώς θα γευτείς την τριχόμπαλά μου.' },
    w2: { en: 'WRONG. *HACK*', de: 'FALSCH. *WÜRG*', el: 'ΛΑΘΟΣ. *ΓΚΧΧ*' },
    w3: { en: 'Hmph. Correct.', de: 'Hmpf. Richtig.', el: 'Χμφ. Σωστά.' },
    w4: { en: 'At last, someone with TASTE. Take the laser pointer. Guard duty was boring anyway.', de: 'Endlich jemand mit GESCHMACK. Nimm den Laserpointer. Wache schieben war sowieso langweilig.', el: 'Επιτέλους, κάποιος με ΓΟΥΣΤΟ. Πάρε το λέιζερ. Έτσι κι αλλιώς βαριόμουν να φυλάω.' },
    r1: { en: 'I fall without getting hurt. I am white and cold. What am I?', de: 'Ich falle, ohne mir wehzutun. Ich bin weiß und kalt. Was bin ich?', el: 'Πέφτω χωρίς να χτυπάω. Είμαι άσπρο και κρύο. Τι είμαι;' },
    r1o: { en: ['Snow', 'A cat', 'An egg'], de: ['Schnee', 'Eine Katze', 'Ein Ei'], el: ['Το χιόνι', 'Μια γάτα', 'Ένα αυγό'] },
    r2: { en: 'The more of them you make, the more you leave behind. What are they?', de: 'Je mehr du davon machst, desto mehr lässt du zurück. Was ist das?', el: 'Όσο περισσότερες κάνεις, τόσο περισσότερες αφήνεις πίσω σου. Τι είναι;' },
    r2o: { en: ['Cookies', 'Footprints', 'Presents'], de: ['Plätzchen', 'Fußspuren', 'Geschenke'], el: ['Τούρτες', 'Πατημασιές', 'Ζημιές'] },
    r3: { en: 'It has whiskers and a tail, it purrs, and it is clearly the cleverest one in this room. Who is it?', de: 'Es hat Schnurrhaare und einen Schwanz, es schnurrt, und es ist eindeutig das Klügste in diesem Raum. Wer ist es?', el: 'Έχει μουστάκια και ουρά, γουργουρίζει και είναι ξεκάθαρα ο πιο έξυπνος εδώ μέσα. Ποιος είναι;' },
    r3o: { en: ['Gary', 'A mouse', 'You, Sir Whiskerton'], de: ['Gary', 'Eine Maus', 'Ihr, Sir Whiskerton'], el: ['Ο Γκάρι', 'Ένα ποντίκι', 'Εσείς, σερ Γουίσκερτον'] },
    de0: { en: "Sir Whiskerton won't let me near the reindeer.", de: 'Sir Whiskerton lässt mich nicht zu den Rentieren.', el: 'Ο σερ Γουίσκερτον δεν με αφήνει να πλησιάσω τους ταράνδους.' },
    de1: { en: "Their eyes are spirals. A plain laser dot won't snap them out of it... I need something shiny to scatter it.", de: 'Ihre Augen sind Spiralen. Ein einfacher Laserpunkt weckt sie nicht auf... Ich brauche etwas Glänzendes, das ihn streut.', el: 'Τα μάτια τους είναι σπείρες. Μια απλή κουκκίδα λέιζερ δεν θα τους ξυπνήσει... Χρειάζομαι κάτι γυαλιστερό για να τη σκορπίσω.' },
    de2: { en: '{name} bounces the laser dot off the shiny bauble. A hundred sparkles dance across the loft!', de: '{name} lenkt den Laserpunkt über die glänzende Kugel. Hundert Funken tanzen durch den Dachstuhl!', el: 'Ο {name} στέλνει την κουκκίδα πάνω στη γυαλιστερή μπάλα. Εκατό λάμψεις χορεύουν παντού!' },
    de3: { en: "It worked! They're blinking! Good reindeer!", de: 'Es hat geklappt! Sie blinzeln! Brave Rentiere!', el: 'Έπιασε! Ανοιγοκλείνουν τα μάτια! Μπράβο, τάρανδοι!' },
    de4: { en: 'Wide awake and ready to fly.', de: 'Hellwach und startklar.', el: 'Ξύπνιοι και έτοιμοι για πτήση.' },
    sl1: { en: "Santa's sleigh! But it's not going anywhere without the reindeer.", de: 'Der Schlitten vom Weihnachtsmann! Aber ohne die Rentiere fährt er nirgendwohin.', el: 'Το έλκηθρο του Αϊ-Βασίλη! Αλλά χωρίς τους ταράνδους δεν πάει πουθενά.' },
    sl2: { en: "The sleigh's snow-globe navigator lights up: Santa's signal. It's moving... across the SKY.", de: 'Das Schneekugel-Navi des Schlittens leuchtet auf: das Signal des Weihnachtsmanns. Es bewegt sich... quer über den HIMMEL.', el: 'Ο πλοηγός-χιονόμπαλα του έλκηθρου ανάβει: το σήμα του Αϊ-Βασίλη. Κινείται... στον ΟΥΡΑΝΟ.' },
    sl3: { en: "Then that's where we're going. Up, up and away!", de: 'Dann fliegen wir genau dorthin. Auf und davon!', el: 'Τότε εκεί πάμε κι εμείς. Πάνω, ψηλά, φύγαμε!' },

    // --- mittens
    mit1: { en: 'That\'s Santa\'s mitten: 1 of 8! He must have dropped more along the way. Keep your eyes peeled!', de: 'Fäustling Nummer 1 von 8! Der Weihnachtsmann hat unterwegs bestimmt noch mehr verloren. Augen offen halten!', el: 'Γάντι νούμερο 1 από 8! Ο Αϊ-Βασίλης θα έχει χάσει κι άλλα στον δρόμο. Τα μάτια σου δεκατέσσερα!' },
    tMitten: { en: 'Santa\'s mitten! {n}/8 found', de: 'Fäustling des Weihnachtsmanns! {n}/8 gefunden', el: 'Γάντι του Αϊ-Βασίλη! {n}/8' },
    pMitten: { en: 'MITTEN!', de: 'FÄUSTLING!', el: 'ΓΑΝΤΙ!' },
    hn_toybox: { en: 'Toy box', de: 'Spielzeugkiste', el: 'Κουτί με παιχνίδια' },
    tb1: { en: "Under the teddy bear... a big green mitten with a white cuff. That's Santa's!", de: 'Unter dem Teddy... ein großer grüner Fäustling mit weißem Bündchen. Der gehört dem Weihnachtsmann!', el: 'Κάτω από το αρκουδάκι... ένα μεγάλο πράσινο γάντι με άσπρο μανίκι. Είναι του Αϊ-Βασίλη!' },
    tb2: { en: 'Just a teddy bear. He looks a bit lonely.', de: 'Nur ein Teddy. Er sieht ein bisschen einsam aus.', el: 'Μόνο ένα αρκουδάκι. Δείχνει λίγο μοναχικό.' },
    mb1: { en: "Oh, Santa! I found these on the way. I think they're yours.", de: 'Ach, Weihnachtsmann! Die hab ich unterwegs gefunden. Ich glaube, die gehören dir.', el: 'Α, Αϊ-Βασίλη! Αυτά τα βρήκα στον δρόμο. Νομίζω ότι είναι δικά σου.' },
    mb2: { en: 'My mittens! All EIGHT of them!', de: 'Meine Fäustlinge! Alle ACHT!', el: 'Τα γάντια μου! Και τα ΟΧΤΩ!' },
    mb3: { en: '...Wait. I only have TWO hands.', de: '...Moment. Ich hab doch nur ZWEI Hände.', el: '...Στάσου. Εγώ έχω μόνο ΔΥΟ χέρια.' },
    mb4: { en: 'I have four paws. Just saying.', de: 'Ich habe vier Pfoten. Nur so als Hinweis.', el: 'Εγώ έχω τέσσερις πατούσες. Απλώς το λέω.' },
    mb5: { en: 'Ho ho ho! Then four for Duchess, two for me, and two for you, {name}. And tonight, YOU ride up front with the reindeer!', de: 'Ho ho ho! Dann vier für Duchess, zwei für mich und zwei für dich, {name}. Und heute Nacht sitzt DU vorne bei den Rentieren!', el: 'Χο χο χο! Τότε τέσσερα για τη Δούκισσα, δύο για μένα και δύο για σένα, {name}. Κι απόψε κάθεσαι ΜΠΡΟΣΤΑ με τους ταράνδους!' },
    // --- 8-stage story links
    stageFmt: { en: 'STAGE {n}', de: 'LEVEL {n}', el: 'ΠΙΣΤΑ {n}' },
    sl4: { en: "But the sleigh won't budge. Its golden sleigh bells are GONE!", de: 'Aber der Schlitten rührt sich nicht. Seine goldenen Schlittenglocken sind WEG!', el: 'Αλλά το έλκηθρο δεν κουνιέται. Τα χρυσά κουδουνάκια του ΕΞΑΦΑΝΙΣΤΗΚΑΝ!' },
    sl5: { en: "A note is tied to the reins: 'BELLS CONFISCATED. Come and get them, if you dare! Captain Whiskers, Frostpine Park.'", de: 'An den Zügeln hängt ein Zettel: „GLOCKEN BESCHLAGNAHMT. Hol sie dir, wenn du dich traust! Kapitän Schnurrbart, Frosttannen-Park.“', el: 'Στα χαλινάρια είναι δεμένο ένα σημείωμα: «ΚΟΥΔΟΥΝΑΚΙΑ ΚΑΤΑΣΧΕΘΗΚΑΝ. Έλα να τα πάρεις, αν τολμάς! Καπετάν Μουστάκιας, Χιονισμένο Πάρκο.»' },
    sl6: { en: "Frostpine Park, huh? Hang on, reindeer. I'll be right back!", de: 'Frosttannen-Park, soso. Haltet durch, Rentiere. Ich bin gleich zurück!', el: 'Χιονισμένο Πάρκο, ε; Κάντε υπομονή, τάρανδοι. Έρχομαι αμέσως!' },
    tGfxSlow: { en: 'Switched to classic graphics for speed (G to switch back)', de: 'Für mehr Tempo auf klassische Grafik umgestellt (G zum Zurückschalten)', el: 'Αλλαγή σε κλασικά γραφικά για ταχύτητα (G για επιστροφή)' },
    tGfxOn: { en: 'Graphics: enhanced (G to switch)', de: 'Grafik: erweitert (G zum Umschalten)', el: 'Γραφικά: βελτιωμένα (G για αλλαγή)' },
    tGfxOff: { en: 'Graphics: classic (G to switch)', de: 'Grafik: klassisch (G zum Umschalten)', el: 'Γραφικά: κλασικά (G για αλλαγή)' },
    // --- outro: off they fly
    o1: { en: "Hop in, partner! Tonight Santa needs a co-pilot.", de: "Steig ein, Partner! Heute Nacht braucht der Weihnachtsmann einen Kopiloten.", el: "Ανέβα, συνεργάτη! Απόψε ο Αϊ-Βασίλης χρειάζεται συγκυβερνήτη." },
    o2: { en: "Me?! In the REAL sleigh?! ...Does it have seatbelts?", de: "Ich?! Im ECHTEN Schlitten?! ...Gibt es da Sicherheitsgurte?", el: "Εγώ;! Στο ΑΛΗΘΙΝΟ έλκηθρο;! ...Έχει ζώνες ασφαλείας;" },
    o3: { en: "It has reindeer. Same thing. Ho ho ho!", de: "Es hat Rentiere. Kommt aufs Gleiche raus. Ho ho ho!", el: "Έχει τάρανδους. Το ίδιο κάνει. Χο χο χο!" },
    o4: { en: "Comet! Cupid! Everybody hold on... GIDDY-UP!", de: "Komet! Amor! Alle festhalten... HÜ HOTT!", el: "Κομήτη! Έρωτα! Κρατηθείτε όλοι... ΕΜΠΡΟΣ!" },
    o5: { en: "Uh... was that supposed to happen?", de: "Äh... sollte das so passieren?", el: "Εεε... έπρεπε να γίνει αυτό;" },
    o6: { en: "A week parked in a cat attic. The runners are full of fur! Hold on to your hat. Again!", de: "Eine Woche auf einem Katzendachboden geparkt. Die Kufen sind voller Katzenhaare! Halt deine Mütze fest. Schon wieder!", el: "Μια βδομάδα παρκαρισμένο σε σοφίτα με γάτες. Τα πατίνια είναι γεμάτα τρίχες! Κράτα το σκουφί σου. Ξανά!" },
    o7: { en: "Ho ho ho! The cats are beaten, the mittens are back and the sleigh flies. It all ended well!", de: "Ho ho ho! Die Katzen sind besiegt, die Fäustlinge sind zurück und der Schlitten fliegt. Alles ist gut ausgegangen!", el: "Χο χο χο! Οι γάτες νικήθηκαν, τα γάντια γύρισαν και το έλκηθρο πετάει. Όλα τελείωσαν καλά!" },
    o8: { en: "So... what now?", de: "Und... was jetzt?", el: "Και... τώρα τι;" },
    o9: { en: "Now the EASY part, partner! We just deliver the presents. Nice, quiet, simple. What could possibly go wrong?", de: "Jetzt kommt der EINFACHE Teil, Partner! Wir liefern nur noch die Geschenke aus. Schön ruhig und simpel. Was soll da schon schiefgehen?", el: "Τώρα έρχεται το ΕΥΚΟΛΟ κομμάτι, συνεργάτη! Απλώς μοιράζουμε τα δώρα. Ήσυχα κι απλά. Τι θα μπορούσε να πάει στραβά;" },
    o10: { en: "Um, Santa? About the presents...", de: "Ähm, Weihnachtsmann? Wegen der Geschenke...", el: "Εμ, Αϊ-Βασίλη; Σχετικά με τα δώρα..." },
    o11: { en: "...Ho. Ho. Oh no.", de: "...Ho. Ho. Oh nein.", el: "...Χο. Χο. Ωχ όχι." },
    o12: { en: "Look! They're falling right down the chimneys!", de: "Schau! Sie fallen genau in die Schornsteine!", el: "Κοίτα! Πέφτουν κατευθείαν μέσα στις καμινάδες!" },
    o13: { en: "Air mail! Ho ho ho! Centuries of climbing down chimneys, and THIS works?!", de: "Luftpost! Ho ho ho! Jahrhundertelang klettere ich durch Schornsteine, und DAS funktioniert?!", el: "Αεροπορικώς! Χο χο χο! Αιώνες κατεβαίνω από καμινάδες, και ΑΥΤΟ δουλεύει;!" },
    o14: { en: "Best. Christmas. EVER!", de: "Bestes. Weihnachten. ALLER ZEITEN!", el: "Τα. Καλύτερα. Χριστούγεννα. ΠΟΤΕ!" },
    pScratch: { en: "SCRRRATCH!", de: "KRRRATZ!", el: "ΣΚΡΡΡΑΤΣ!" },
    pPlop: { en: "PLOP!", de: "PLOPP!", el: "ΠΛΟΠ!" },
    pOof: { en: "OOF!", de: "UFF!", el: "ΟΥΦ!" },
    // --- stage 8: the storage loft
    sgDogs: { en: "NO DOGS ALLOWED", de: "KEINE HUNDE ERLAUBT", el: "ΑΠΑΓΟΡΕΥΟΝΤΑΙ ΟΙ ΣΚΥΛΟΙ" },
    sgOrn: { en: "CAUTION: FALLING BAUBLES", de: "VORSICHT: FALLENDE KUGELN", el: "ΠΡΟΣΟΧΗ: ΠΕΦΤΟΥΝ ΜΠΑΛΕΣ" },
    sgTree: { en: "TOTALLY A NORMAL TREE", de: "GANZ NORMALER BAUM", el: "ΕΝΤΕΛΩΣ ΚΑΝΟΝΙΚΟ ΔΕΝΤΡΟ" },
    tJack: { en: "Land on a jack-in-the-box to bounce sky-high!", de: "Spring auf ein Schachtelmännchen, um hoch hinauf zu hüpfen!", el: "Πάτα πάνω σε κουτί-έκπληξη για να εκτοξευτείς ψηλά!" },
    jg1: { en: "GARY?! What are you doing in a box?!", de: "GARY?! Was machst du denn in einer Kiste?!", el: "ΓΚΑΡΙ;! Τι κάνεις μέσα σε κουτί;!" },
    jg2: { en: "Seasonal job. Duchess pays me in yarn. ...I'm not great at negotiating.", de: "Saisonjob. Duchess bezahlt mich in Wolle. ...Ich kann nicht so gut verhandeln.", el: "Εποχική δουλειά. Η Δούκισσα με πληρώνει σε μαλλί. ...Δεν τα πάω καλά στα παζάρια." },
    jg3: { en: "Well... thanks for the boost!", de: "Na dann... danke für den Schwung!", el: "Ε... ευχαριστώ για την εκτόξευση!" },
    pMeowDog: { en: "...MEOW?", de: "...MIAU?", el: "...ΝΙΑΟΥ;" },
    pGeronimeow: { en: "GERONIMEOW!", de: "GERONIMIAU!", el: "ΓΕΡΟΝΙΜΙΑΟΥ!" },
    pMeowprise: { en: "MEOW-PRISE!", de: "MIAU-RASCHUNG!", el: "ΝΙΑΟΥ-ΕΚΠΛΗΞΗ!" },
    pHoHoOw: { en: "HO HO H-OW!", de: "HO HO H-AU!", el: "ΧΟ ΧΟ Χ-ΟΥΧ!" },
    pFore: { en: "FORE!", de: "ACHTUNG!", el: "ΠΡΟΣΟΧΗ!" },
    de5: { en: "Their eyes are spirals, stuck on a dot that isn't there. Maybe something from my bag can snap them out of it.", de: "Ihre Augen sind Spiralen und starren auf einen Punkt, den es nicht gibt. Vielleicht hilft etwas aus meiner Tasche.", el: "Τα μάτια τους είναι σπείρες, καρφωμένα σε μια κουκκίδα που δεν υπάρχει. Ίσως κάτι από την τσάντα μου να τους ξυπνήσει." },
    // --- stage 3 hints (Easy, after 5 minutes without progress)
    hz_gary1: { en: "Hmm... that Santa on the square looks a bit suspicious. Maybe I should talk to him.", de: "Hmm... der Weihnachtsmann auf dem Platz sieht verdächtig aus. Vielleicht sollte ich mit ihm reden.", el: "Χμμ... αυτός ο Αϊ-Βασίλης στην πλατεία μού φαίνεται ύποπτος. Ας του μιλήσω." },
    hz_gary2: { en: "Hint: click the Mall Santa in the middle of the square and talk to him.", de: "Tipp: Klick auf den Kaufhaus-Weihnachtsmann in der Mitte des Platzes und rede mit ihm.", el: "Βοήθεια: κάνε κλικ στον Αϊ-Βασίλη του εμπορικού, στη μέση της πλατείας, και μίλα του." },
    hz_owner1: { en: "Hmm... the toy seller was shivering. Something warm would cheer them up.", de: "Hmm... der Spielzeughändler hat so gezittert. Etwas Warmes würde ihn aufmuntern.", el: "Χμμ... ο πωλητής παιχνιδιών τουρτούριζε. Κάτι ζεστό θα του έφτιαχνε τη διάθεση." },
    hz_owner2: { en: "Hint: click the hot cocoa in your bag, then click the toy seller in the toy shop.", de: "Tipp: Klick in der Tasche auf den heißen Kakao und dann im Spielzeugladen auf den Spielzeughändler.", el: "Βοήθεια: κάνε κλικ στο ζεστό κακάο στην τσάντα σου και μετά στον πωλητή, μέσα στο παιχνιδάδικο." },
    hz_cat1: { en: "Hmm... what do cats love chasing more than anything?", de: "Hmm... was jagen Katzen am allerliebsten?", el: "Χμμ... τι λατρεύουν να κυνηγάνε οι γάτες πιο πολύ απ' όλα;" },
    hz_cat2: { en: "Hint: in the bakery, click the wind-up mouse in your bag, then the cat on the gingerbread.", de: "Tipp: Klick in der Bäckerei die Aufziehmaus in deiner Tasche an und dann die Katze auf dem Lebkuchen.", el: "Βοήθεια: στον φούρνο, κάνε κλικ στο κουρδιστό ποντίκι στην τσάντα σου και μετά στη γάτα πάνω στα γλυκά." },
    hz_parrot1: { en: "Hmm... the parrot in the pet shop wants a snack. And parrots repeat everything they hear!", de: "Hmm... der Papagei im Tierladen hat Hunger. Und Papageien plappern alles nach, was sie hören!", el: "Χμμ... ο παπαγάλος στο pet shop πεινάει. Και οι παπαγάλοι επαναλαμβάνουν ό,τι ακούνε!" },
    hz_parrot2: { en: "Hint: click the crackers in your bag, then the parrot in the pet shop. Remember what it squawks!", de: "Tipp: Klick die Cracker in deiner Tasche an und dann den Papagei im Tierladen. Merk dir, was er krächzt!", el: "Βοήθεια: κάνε κλικ στα κράκερ στην τσάντα σου και μετά στον παπαγάλο, στο pet shop. Θυμήσου τι κρώζει!" },
    hz_keeper1: { en: "Hmm... the paw print on my delivery note. Maybe someone in the pet shop knows it.", de: "Hmm... der Pfotenabdruck auf meinem Lieferschein. Vielleicht kennt ihn jemand im Tierladen.", el: "Χμμ... η πατούσα στο δελτίο παράδοσης. Ίσως κάποιος στο pet shop την αναγνωρίζει." },
    hz_keeper2: { en: "Hint: talk to the pet shop owner behind the counter.", de: "Tipp: Rede mit dem Zoohändler hinter der Theke.", el: "Βοήθεια: μίλα με τον ιδιοκτήτη του pet shop, πίσω από τον πάγκο." },
    hz_bag1: { en: "Hmm... one of those cat-food bags has the same logo as my note: a paw with a star.", de: "Hmm... eine der Katzenfutter-Tüten hat dasselbe Logo wie mein Lieferschein: eine Pfote mit Stern.", el: "Χμμ... ένα από τα σακουλάκια γατοτροφής έχει το ίδιο σήμα με το δελτίο μου: πατούσα με αστέρι." },
    hz_bag2: { en: "Hint: on the pet shop shelf, click the cat-food bag with the STAR on it.", de: "Tipp: Klick im Regal des Tierladens auf die Katzenfutter-Tüte mit dem STERN.", el: "Βοήθεια: στο ράφι του pet shop, κάνε κλικ στο σακουλάκι γατοτροφής με το ΑΣΤΕΡΙ." },
    hz_tower1: { en: "I know the password AND what the tower cats eat. To the clock tower!", de: "Ich kenne das Passwort UND weiß, was die Turmkatzen fressen. Auf zum Uhrturm!", el: "Ξέρω το σύνθημα ΚΑΙ τι τρώνε οι γάτες του πύργου. Πάμε στον πύργο με το ρολόι!" },
    hz_tower2: { en: "Hint: at the clock tower door, answer '{pw}', then '{brand}', then '{clock}'.", de: "Tipp: Antworte an der Tür zum Uhrturm mit „{pw}“, dann „{brand}“, dann „{clock}“.", el: "Βοήθεια: στην πόρτα του πύργου απάντησε «{pw}», μετά «{brand}» και μετά «{clock}»." },
    hz_whisk1: { en: "Sir Whiskerton guards the sleigh. I have to answer his riddles. And he does love flattery...", de: "Sir Whiskerton bewacht den Schlitten. Ich muss seine Rätsel lösen. Und er mag Schmeicheleien...", el: "Ο σερ Γουίσκερτον φυλάει το έλκηθρο. Πρέπει να λύσω τους γρίφους του. Και του αρέσουν οι κολακείες..." },
    hz_whisk2: { en: "Hint: click Sir Whiskerton. The answers are '{a1}', '{a2}' and '{a3}'.", de: "Tipp: Klick auf Sir Whiskerton. Die Antworten sind „{a1}“, „{a2}“ und „{a3}“.", el: "Βοήθεια: κάνε κλικ στον σερ Γουίσκερτον. Οι απαντήσεις είναι «{a1}», «{a2}» και «{a3}»." },
    hz_bauble1: { en: "Hmm... the reindeer need something SHINY. Wasn't the toy shop giving shiny things away?", de: "Hmm... die Rentiere brauchen etwas GLÄNZENDES. Gab es im Spielzeugladen nicht etwas umsonst?", el: "Χμμ... οι τάρανδοι χρειάζονται κάτι ΓΥΑΛΙΣΤΕΡΟ. Το παιχνιδάδικο δεν χάριζε γυαλιστερά πράγματα;" },
    hz_bauble2: { en: "Hint: go back to the toy shop and take the shiny bauble from the counter.", de: "Tipp: Geh zurück in den Spielzeugladen und nimm die glänzende Kugel von der Theke.", el: "Βοήθεια: γύρνα στο παιχνιδάδικο και πάρε τη γυαλιστερή μπάλα από τον πάγκο." },
    hz_deer1: { en: "The reindeer are in a trance. A laser dot... and something shiny to scatter it?", de: "Die Rentiere sind wie in Trance. Ein Laserpunkt... und etwas Glänzendes, das ihn streut?", el: "Οι τάρανδοι είναι σαν υπνωτισμένοι. Μια κουκκίδα λέιζερ... και κάτι γυαλιστερό να τη σκορπίσει;" },
    hz_deer2: { en: "Hint: click the laser pointer in your bag, then click the reindeer.", de: "Tipp: Klick den Laserpointer in deiner Tasche an und dann die Rentiere.", el: "Βοήθεια: κάνε κλικ στο λέιζερ στην τσάντα σου και μετά στους τάρανδους." },
    hz_sleigh1: { en: "The reindeer are awake! What's left to do here?", de: "Die Rentiere sind wach! Was fehlt jetzt noch?", el: "Οι τάρανδοι ξύπνησαν! Τι άλλο μένει;" },
    hz_sleigh2: { en: "Hint: click Santa's sleigh.", de: "Tipp: Klick auf den Schlitten des Weihnachtsmanns.", el: "Βοήθεια: κάνε κλικ στο έλκηθρο του Αϊ-Βασίλη." },
    // --- stage 4: Frostpine Park
    stageZSub: { en: 'Frostpine Park', de: 'Frosttannen-Park', el: 'Το Χιονισμένο Πάρκο' },
    z1: { en: 'Frostpine Park. Captain Whiskers is hiding the sleigh bells in here somewhere.', de: 'Der Frosttannen-Park. Hier irgendwo versteckt Kapitän Schnurrbart die Schlittenglocken.', el: 'Το Χιονισμένο Πάρκο. Κάπου εδώ ο Καπετάν Μουστάκιας κρύβει τα κουδουνάκια.' },
    z2: { en: 'Walk off the edge of the screen to explore. X swings the candy cane, and it cuts bushes too.', de: 'Lauf über den Bildschirmrand, um weiterzukommen. X schwingt die Zuckerstange, die auch Büsche schneidet.', el: 'Βγες από την άκρη της οθόνης για να εξερευνήσεις. Το X χτυπάει με το μπαστουνάκι, που κόβει και θάμνους.' },
    zk1: { en: "Psst! Over here! It's me, Slushman. They're selling me as a SNOW CONE now. Half price.", de: 'Psst! Hier drüben! Ich bin es, Matschmann. Jetzt verkaufen sie mich als EISKEGEL. Zum halben Preis.', el: 'Ψιτ! Εδώ! Εγώ είμαι, ο Λασποχιονάς. Τώρα με πουλάνε για ΧΙΟΝΑΚΙ σε χωνάκι. Μισοτιμής.' },
    zk2: { en: 'A tip, since you put me in the freezer: the Captain\'s helmet is too hard. Make him charge into a tree, THEN bonk him.', de: 'Ein Tipp, weil du mich in die Gefriertruhe gesteckt hast: Der Helm vom Kapitän ist zu hart. Lass ihn gegen einen Baum rennen, DANN hau zu.', el: 'Μια συμβουλή, επειδή με έβαλες στον καταψύκτη: το κράνος του Καπετάνιου είναι πολύ σκληρό. Κάνε τον να πέσει πάνω σε δέντρο και ΜΕΤΑ χτύπα τον.' },
    zk3: { en: 'Snow cones! Get your... oh, it\'s you. Remember: tree first, THEN bonk.', de: 'Eiskegel! Holt euch... ach, du bist es. Denk dran: erst der Baum, DANN zuhauen.', el: 'Χιονάκια! Πάρτε... α, εσύ είσαι. Θυμήσου: πρώτα το δέντρο, ΜΕΤΑ το χτύπημα.' },
    zL: { en: 'A locked gate. It needs a small key.', de: 'Ein verschlossenes Tor. Dafür braucht man einen kleinen Schlüssel.', el: 'Κλειδωμένη πύλη. Θέλει ένα μικρό κλειδί.' },
    zLo: { en: 'The small key fits! The gate creaks open.', de: 'Der kleine Schlüssel passt! Das Tor knarrt auf.', el: 'Το μικρό κλειδί ταιριάζει! Η πύλη ανοίγει τρίζοντας.' },
    zD: { en: 'A gate with a golden lock. Only a golden key will do.', de: 'Ein Tor mit goldenem Schloss. Da hilft nur ein goldener Schlüssel.', el: 'Πύλη με χρυσή κλειδαριά. Μόνο χρυσό κλειδί κάνει.' },
    zDo: { en: 'The golden key turns... The gazebo is open!', de: 'Der goldene Schlüssel dreht sich... Der Pavillon ist offen!', el: 'Το χρυσό κλειδί γυρίζει... Το κιόσκι άνοιξε!' },
    zC1: { en: 'The pond is quiet now... and a chest has appeared!', de: 'Am Teich ist es jetzt ruhig... und eine Truhe ist aufgetaucht!', el: 'Στη λίμνη επικρατεί ησυχία... και εμφανίστηκε ένα σεντούκι!' },
    zK: { en: 'A small key! There was a locked gate by the pond...', de: 'Ein kleiner Schlüssel! Am Teich war doch ein verschlossenes Tor...', el: 'Ένα μικρό κλειδί! Δίπλα στη λίμνη υπήρχε μια κλειδωμένη πύλη...' },
    zG: { en: 'The GOLDEN KEY! Now for the gazebo above the pond.', de: 'Der GOLDENE SCHLÜSSEL! Jetzt zum Pavillon oberhalb des Teichs.', el: 'Το ΧΡΥΣΟ ΚΛΕΙΔΙ! Τώρα στο κιόσκι πάνω από τη λίμνη.' },
    zb1: { en: "Arr... I mean, MEOW! I'm Captain Whiskers, and these bells belong to Duchess now!", de: 'Arrr... ich meine, MIAU! Ich bin Kapitän Schnurrbart, und diese Glocken gehören jetzt Duchess!', el: 'Αρρ... εννοώ, ΝΙΑΟΥ! Είμαι ο Καπετάν Μουστάκιας και τα κουδουνάκια ανήκουν πια στη Δούκισσα!' },
    zb2: { en: 'Nice helmet.', de: 'Schöner Helm.', el: 'Ωραίο κράνος.' },
    zb3: { en: "Thank you! It's dented. Don't ask.", de: 'Danke! Er hat eine Delle. Frag nicht.', el: 'Ευχαριστώ! Είναι στραβωμένο. Μη ρωτάς.' },
    zb4: { en: 'So... dizzy... Fine, take your jingly bells. The Boss will never... (snore)', de: 'So... schwindelig... Na gut, nimm deine Bimmelglocken. Der Boss wird nie... (schnarch)', el: 'Ζαλίζομαι... πολύ... Καλά, πάρε τα κουδουνάκια σου. Το Αφεντικό δεν θα... (ροχαλητό)' },
    zb5: { en: 'The golden sleigh bells! Hang on, reindeer, here I come!', de: 'Die goldenen Schlittenglocken! Haltet durch, Rentiere, ich komme!', el: 'Τα χρυσά κουδουνάκια! Κάντε υπομονή, τάρανδοι, έρχομαι!' },
    tBossZ: { en: 'Normal hits bounce off. Dodge so he crashes into a tree!', de: 'Normale Treffer prallen ab. Weich aus, damit er gegen einen Baum kracht!', el: 'Τα απλά χτυπήματα αναπηδούν. Απόφυγέ τον για να πέσει σε δέντρο!' },
    nCaptU: { en: 'CAPTAIN WHISKERS', de: 'KAPITÄN SCHNURRBART', el: 'ΚΑΠΕΤΑΝ ΜΟΥΣΤΑΚΙΑΣ' },
    n_capt: { en: 'Captain Whiskers', de: 'Kapitän Schnurrbart', el: 'Καπετάν Μουστάκιας' },
    pClang: { en: 'CLANG!', de: 'KLONG!', el: 'ΚΛΑΝΓΚ!' },
    pCrash: { en: 'CRASH!', de: 'KRACH!', el: 'ΜΠΑΜ!' },
    pCrew: { en: 'CREW, ATTACK!', de: 'MANNSCHAFT, ANGRIFF!', el: 'ΠΛΗΡΩΜΑ, ΕΠΙΘΕΣΗ!' },
    pKey: { en: 'KEY!', de: 'SCHLÜSSEL!', el: 'ΚΛΕΙΔΙ!' },
    pGoldKey: { en: 'GOLDEN KEY!', de: 'GOLDSCHLÜSSEL!', el: 'ΧΡΥΣΟ ΚΛΕΙΔΙ!' },
    // --- stage 6: Rooftop Rumble
    stageBSub: { en: 'Rooftop Rumble', de: 'Rauferei auf dem Dach', el: 'Καβγάς στη στέγη' },
    rr1: { en: 'The Hairball crash-landed on the roof, and its crew is climbing out of the wreck. They look grumpy.', de: 'Die Haarball ist auf dem Dach notgelandet, und ihre Mannschaft klettert aus dem Wrack. Sie sehen grummelig aus.', el: 'Το Τριχομπαλό έπεσε πάνω στη στέγη και το πλήρωμά του βγαίνει από τα συντρίμμια. Φαίνονται γκρινιάρηδες.' },
    rr2: { en: 'Comet the reindeer lands on the roof beside {name}. SNORT!', de: 'Komet, das Rentier, landet neben {name} auf dem Dach. SCHNAUB!', el: 'Ο τάρανδος Κομήτης προσγειώνεται δίπλα στον {name}. ΦΡΡ!' },
    rr3: { en: "Comet! You came back for me! Okay, team: we do this the old-school way. One turn at a time!", de: 'Komet! Du bist zurückgekommen! Okay, Team: Wir machen das wie früher. Eine Runde nach der anderen!', el: 'Κομήτη! Γύρισες για μένα! Εντάξει, ομάδα: θα το κάνουμε σαν τα παλιά. Ένας γύρος τη φορά!' },
    bt1: { en: 'Pick a command for each hero. Sneak can steal things. Run... will not help.', de: 'Wähle für jeden Helden einen Befehl. Schleichen kann Dinge stehlen. Fliehen... bringt nichts.', el: 'Διάλεξε εντολή για κάθε ήρωα. Το Κλέψιμο αρπάζει πράγματα. Η Φυγή... δεν θα βοηθήσει.' },
    rr4: { en: "Don't laugh. I'm a SLIME now. It's a phase.", de: 'Nicht lachen. Ich bin jetzt ein SCHLEIM. Das ist nur eine Phase.', el: 'Μη γελάς. Τώρα είμαι ΖΕΛΕΣ. Είναι μια φάση.' },
    rr4b: { en: 'Slushman?! How many forms do you HAVE?', de: 'Matschmann?! Wie viele Formen HAST du eigentlich?', el: 'Λασποχιονά;! Πόσες μορφές ΕΧΕΙΣ τελικά;' },
    rr5: { en: 'Slushman melted. Again.', de: 'Matschmann ist geschmolzen. Mal wieder.', el: 'Ο Λασποχιονάς έλιωσε. Ξανά.' },
    rr6: { en: 'ATTEN-TION! I am General Fluffington, and NO human gets past my FLUFF!', de: 'STILLGESTANDEN! Ich bin General Flauschington, und KEIN Mensch kommt an meinem FLAUSCH vorbei!', el: 'ΠΡΟΣΟΧΗ! Είμαι ο Στρατηγός Χνουδωτός και ΚΑΝΕΝΑΣ άνθρωπος δεν περνάει από το ΧΝΟΥΔΙ μου!' },
    rr7: { en: 'Your fluff is very impressive. But I have a reindeer.', de: 'Dein Flausch ist sehr beeindruckend. Aber ich habe ein Rentier.', el: 'Το χνούδι σου είναι πολύ εντυπωσιακό. Αλλά εγώ έχω τάρανδο.' },
    rr8: { en: "Something green is stuck in the General's fur... It looks like Santa's mitten!", de: 'Im Fell des Generals steckt etwas Grünes... Sieht aus wie ein Fäustling des Weihnachtsmanns!', el: 'Κάτι πράσινο έχει κολλήσει στη γούνα του Στρατηγού... Μοιάζει με γάντι του Αϊ-Βασίλη!' },
    rr9: { en: "Defeated... by a child and a DEER. I'm going for a nap. A long one.", de: 'Besiegt... von einem Kind und einem HIRSCH. Ich mache jetzt ein Nickerchen. Ein langes.', el: 'Ηττήθηκα... από ένα παιδί κι ένα ΕΛΑΦΙ. Πάω για υπνάκο. Μεγάλο.' },
    rr10: { en: "The attic window is boarded up! ...Fine. Then I'm going down the chimney. Like a professional.", de: 'Das Dachbodenfenster ist zugenagelt! ...Na gut. Dann nehme ich eben den Kamin. Wie ein Profi.', el: 'Το παράθυρο της σοφίτας είναι καρφωμένο! ...Καλά. Τότε θα κατέβω από την καμινάδα. Σαν επαγγελματίας.' },
    n_gen: { en: 'General Fluffington', de: 'General Flauschington', el: 'Στρατηγός Χνουδωτός' },

    pz2: { en: 'Doctor {name} is in. Prescription: CANDY. Lots of it.', de: 'Doktor {name} ist da. Rezept: BONBONS. Jede Menge.', el: 'Ο γιατρός {name} είναι εδώ. Συνταγή: ΚΑΡΑΜΕΛΕΣ. Πολλές.' },
    pz3: { en: "Line up four of the same colour to clear them. Doctor's orders!", de: 'Vier gleiche Farben in eine Reihe bringen, dann verschwinden sie. Anweisung vom Doktor!', el: 'Βάλε τέσσερα ίδια χρώματα στη σειρά και εξαφανίζονται. Εντολή του γιατρού!' },
    pz4: { en: 'All clear! Here goes... WHEEEE!', de: 'Alles frei! Und los... JUHUUUU!', el: 'Καθάρισε! Πάμε... ΓΙΟΥΧΟΥΟΥ!' },

  // ---------- christmas tree ----------
  function treePB(blink, empty) {
    const pb = new PB(60, 92); const rr = seeded(42);
    pb.rect(26, 78, 8, 9, '#5a2e1a'); pb.rect(27, 78, 2, 9, '#7a4a2a');
    const tiers = [[10, 30, 12], [22, 48, 18], [38, 64, 23], [54, 80, 28]];
    for (const tr of tiers) for (let y = tr[0]; y <= tr[1]; y++) {
      const hw = lerp(2, tr[2], (y - tr[0]) / (tr[1] - tr[0]));
      pb.rect(Math.round(30 - hw), y, Math.round(hw * 2), 1, '#2f9a52');
      pb.rect(Math.round(30 + hw * 0.25), y, Math.round(hw * 0.75), 1, '#237a42');
      if (y === tr[1]) for (let x = Math.round(30 - hw); x < 30 + hw; x += 3) pb.set(x, y + 1, '#1c5e34');
    }
    for (let i = 0; i < 40; i++) { const y = rint(12, 79); const tr = tiers.find((t) => y >= t[0] && y <= t[1]) || tiers[3]; const hw = lerp(2, tr[2], (y - tr[0]) / (tr[1] - tr[0])) - 2; pb.set(30 + (rr() * 2 - 1) * hw, y, '#82d65f'); }
    // garland
    for (const g of [[18, 28, 40, 40], [16, 56, 44, 46], [14, 74, 46, 62]]) for (let k = 0; k <= 30; k++) { const x = lerp(g[0], g[2], k / 30), y = lerp(g[1], g[3], k / 30) + Math.sin(k / 30 * Math.PI) * 3; pb.set(x, y, '#ffd84a'); if (k % 3 === 0) pb.set(x, y + 1, '#c9952a'); }
    // ornaments
    const ornC = ['#e0333f', '#4479e0', '#ffd84a', '#ff8fa8', '#9b6cf6'];
    const orn = [[24, 24], [36, 28], [20, 40], [33, 44], [42, 36], [16, 58], [28, 54], [40, 60], [12, 72], [24, 70], [36, 74], [48, 70], [30, 36]];
    orn.forEach((o, i) => { pb.circle(o[0], o[1], 2, ornC[i % ornC.length]); pb.set(o[0] - 1, o[1] - 1, '#ffffff'); });
    // lights
    const lights = [[29, 16], [22, 33], [38, 34], [26, 46], [14, 50], [44, 50], [20, 62], [34, 64], [8, 77], [30, 78], [50, 77], [42, 42], [18, 74]];
    const LA = ['#ff5a5a', '#5fd2ff', '#ffe066', '#7dff8a'], LB = ['#ffe066', '#ff5a5a', '#7dff8a', '#5fd2ff'];
    lights.forEach((l, i) => { const c = (blink ? LB : LA)[i % 4]; pb.rect(l[0], l[1], 2, 2, c); if ((i + (blink ? 1 : 0)) % 2) pb.set(l[0] - 1, l[1], c, 140); });
    // star
    const star = ['....y....', '...yyy...', 'yyyywyyyy', '.yyyyyyy.', '..yyyyy..', '.yyy.yyy.', '.yy...yy.'];
    for (let r = 0; r < star.length; r++) for (let c = 0; c < star[r].length; c++) { const ch = star[r][c]; if (ch !== '.') pb.set(26 + c, 2 + r, ch === 'w' ? '#ffffff' : (blink ? '#ffe680' : '#ffd84a')); }
    pb.outline('#0f2a1a');
    // skirt (drawn after outline so it overlaps nicely)
    pb.ellipse(30, 87, 26, 3.4, '#c0303c'); pb.ellipse(30, 86.4, 24, 2.2, '#e0333f');
    for (let x = 6; x < 56; x += 3) pb.set(x, 89, '#ffffff');
    if (!empty) {
      const gifts = [[8, 76, 12, 10, '#4479e0', '#ffd84a'], [20, 80, 10, 8, '#2f9a52', '#e0333f'], [36, 78, 12, 9, '#ff8fa8', '#ffffff'], [46, 81, 9, 7, '#ffd84a', '#e0333f']];
      for (const g of gifts) pb.blit(giftPB(g[2], g[3], g[4], g[5]), g[0], g[1] - 4);
    }
    return pb;
  }

    pb.circle(w - 10, 10, 3.5, '#fff6c8');

  // ================= ENHANCED GRAPHICS: 2D deferred lighting, soft shadows, bloom, VFX =================
  // Passes (all tiny, 320x180 unless noted):
  //   1 albedo      the unlit pixel-art scene                         (layers 0 + 2)

  //   8 overlay     fades, drawn straight to the screen                (layer 3)
