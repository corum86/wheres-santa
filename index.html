  function gfxInit() {
    const RT = (w, h, linear, depth) => { const r = new THREE.WebGLRenderTarget(w, h, { depthBuffer: !!depth, stencilBuffer: false }); r.texture.minFilter = r.texture.magFilter = linear ? THREE.LinearFilter : THREE.NearestFilter; r.texture.generateMipmaps = false; return r; };
    const g = gfx;
    g.rtA = RT(W, H, false, true); g.rtE = RT(W, H, false, true); g.rtL = RT(W, H, true, false); g.rtM = RT(W, H, false, true); g.rtF = RT(W, H, false, true); g.rtS = RT(W, H, true, false);
    g.rtB0 = RT(W, H, true, false); g.rtB1 = RT(W, H, true, false); g.rtC0 = RT(W / 2, H / 2, true, false); g.rtC1 = RT(W / 2, H / 2, true, false);
    g.rts = [g.rtA, g.rtE, g.rtL, g.rtM, g.rtF, g.rtS, g.rtB0, g.rtB1, g.rtC0, g.rtC1];
    // soft round light + a soft beam for window shafts
    const mkTex = (fn) => { const N = 64, d = new Uint8Array(N * N * 4); for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const v = Math.max(0, Math.min(1, fn((x + 0.5) / N, (y + 0.5) / N))); const k = (y * N + x) * 4; d[k] = d[k + 1] = d[k + 2] = Math.round(v * 255); d[k + 3] = 255; } const t = new THREE.DataTexture(d, N, N, THREE.RGBAFormat); t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true; return t; };
    g.texRound = mkTex((u, v) => { const q = Math.hypot(u - 0.5, v - 0.5) * 2; const f = Math.max(0, 1 - q); return f * f * (0.55 + 0.45 * f); });
    g.texShaft = mkTex((u, v) => { const side = Math.max(0, 1 - Math.abs(u - 0.5) * 2); return Math.pow(side, 0.8) * Math.pow(v, 0.9) * (1 - Math.pow(v, 6)); });
    g.lightScene = new THREE.Scene(); g.unit = new THREE.PlaneGeometry(1, 1);
    for (let i = 0; i < 72; i++) { const mt = new THREE.MeshBasicMaterial({ map: g.texRound, color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false }); const m = new THREE.Mesh(g.unit, mt); m.visible = false; m.frustumCulled = false; g.lightScene.add(m); g.pool.push(m); }

    g.quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); g.quadScene = new THREE.Scene();
    const VS = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
    const SM = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: VS, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false });
    const EMIT = 'float emitK(vec3 c) { float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b)); float sat = mx > 0.0 ? (mx - mn) / mx : 0.0; return smoothstep(0.9, 0.99, mx) * smoothstep(0.45, 0.6, sat); }';
    g.uBlurM = { t: { value: null }, px: { value: new THREE.Vector2(1 / W, 1 / H) } };
    g.mBlurM = SM('varying vec2 vUv; uniform sampler2D t; uniform vec2 px; void main() { float a = 0.0; a += texture2D(t, vUv).a * 0.2; a += texture2D(t, vUv + px * vec2(1.5, 0.5)).a * 0.2; a += texture2D(t, vUv + px * vec2(-1.5, -0.5)).a * 0.2; a += texture2D(t, vUv + px * vec2(-0.5, 1.5)).a * 0.2; a += texture2D(t, vUv + px * vec2(0.5, -1.5)).a * 0.2; gl_FragColor = vec4(a); }', g.uBlurM);

    g.mBright = SM('varying vec2 vUv; uniform sampler2D tA, tE, tL; uniform vec3 amb; ' + EMIT + ' void main() { vec3 a = texture2D(tA, vUv).rgb; vec4 e = texture2D(tE, vUv); vec3 l = amb + texture2D(tL, vUv).rgb; vec3 lit = a * l; vec3 b = max(lit - 0.97, 0.0) * 1.3 + a * emitK(a) * 0.16 + e.rgb * 0.7; gl_FragColor = vec4(b, 1.0); }', g.uBright);

    };
    g.mComp = SM([
      'varying vec2 vUv; uniform sampler2D tA, tE, tL, tM, tF, tS, tB0, tB1; uniform vec3 amb, tint, shock; uniform vec2 sdir; uniform float shK, vig, haze, bloomK, time, ca; uniform vec4 uL[4];', EMIT,

      'float occ(vec2 p, vec2 dir) { float o = 0.0; for (int k = 1; k <= 6; k++) { float f = float(k) / 6.0; o = max(o, texture2D(tS, (p + dir * f) / RES).r * (1.0 - f * 0.55)); } return o; }',

      if (moved) { cur = (cur + moved + opts.length) % opts.length; SFX.blip(1100); push(); if (opts[cur].hover) opts[cur].hover(); }
      let pick = null; if (BT.clickPick != null) { pick = BT.clickPick; BT.clickPick = null; } else if (pressed.confirm || pressed.attack || pressed.hop) pick = cur;

  // ---------- art ----------

  // one half of a pill: rounded at one end, open toward its partner (shape = the side it links to)
  function candyPZ(c, shape) {

    const v = shape === 'U' || shape === 'D';
    for (let y = 0; y < PS; y++) for (let x = 0; x < PS; x++) {

      let a = v ? py : px, b = v ? px : py; // a: along the pill, b: across
